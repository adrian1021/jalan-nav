async function calcPlan(){
  const P1=S.plan, stops=P1.stops.filter(Boolean);
  if(!stops.length){ $("pOut").innerHTML='<p class="hint">Add at least one place first.</p>'; return; }
  const start = S.pos ? {...S.pos, name:"My location"} : {...map.getCenter(), name:"Map centre"};
  const all = P1.round ? [...stops, start] : stops;
  const dest = all[all.length-1], via = all.slice(0,-1);
  $("pOut").innerHTML='<p class="hint">Working out your trip…</p>';
  try{
    const rs = await fetchRoutes(start, dest, 0, {via, best:P1.best});
    const R = rs[0];
    if(R.order && R.order.length===via.length){      // put the stops in the order the route visits them
      const nv = R.order.map(k=>via[k]); via.splice(0, via.length, ...nv);
      P1.stops = P1.round ? [...nv] : [...nv, dest]; savePlan(); }
    S.via=via; S.dest=dest; S.routes=[R]; S.sel=0; P1.res={start, names:[start.name, ...via.map(v=>v.name), dest.name]};
    if(destMarker) destMarker.remove();
    destMarker = L.marker(dest,{icon:L.divIcon({className:"",html:'<div class="destpin"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
    resetNorth(); drawRoutes(); drawStops(); renderPlanner();
    withAlerts(R, ()=>{ if(S.sheetClose===closePlanner && S.routes[0]===R){ const sc=$("sheet").scrollTop; renderPlanner(); $("sheet").scrollTop=sc; } });
    map.fitBounds(L.latLngBounds(R.pts), {paddingTopLeft:[30,60], paddingBottomRight:[30, Math.min(sheetH(), innerHeight*0.55)+30]});
  }catch(e){ $("pOut").innerHTML='<p class="hint">Couldn\'t plan this trip: '+esc(e.message)+'</p>'; }
}
function planResult(){
  const R=S.routes[0], names=S.plan.res.names, u=tripUse(R.distance, R.duration);
  let h='<div class="tsum"><div><b>'+fmtDist(R.distance)+'</b><span>Distance</span></div><div><b>'+fmtDur(R.duration)+'</b><span>Driving'+(R.live&&R.delay>=60?' (incl. +'+Math.round(R.delay/60)+' min traffic)':'')+'</span></div><div><b>'+clock(new Date(Date.now()+R.duration*1000))+'</b><span>Arrive</span></div></div>'+
    '<div class="tcost"><div><span>'+(u.ev?"🔌":"⛽")+' '+u.q.toFixed(1)+' '+u.unit+'</span></div><div><b>RM'+u.cost.toFixed(2)+'</b><span>actual price</span></div>'+
    (u.sub!=null? '<div><b>RM'+u.sub.toFixed(2)+'</b><span>subsidised</span></div>' : '')+'</div><ol class="legs">';
  (R.legs||[]).forEach((L1,k)=>{ const lu=tripUse(L1.distance, L1.duration);
    h+='<li><b>'+esc(names[k])+' → '+esc(names[k+1])+'</b><span>'+fmtDist(L1.distance)+' · '+fmtDur(L1.duration)+' · RM'+lu.cost.toFixed(2)+(lu.sub!=null?' (RM'+lu.sub.toFixed(2)+')':'')+'</span></li>'; });
  h+='</ol>'+alertsHTML(R)+'<p class="hint">Petrol only; tolls and parking aren\'t included. '+(R.live?"Times include live traffic.":"Times are free-flow estimates.")+'</p>'+
    '<div class="row"><button class="btn go" id="pGo">GO</button><button class="btn" id="pSim">Simulate</button></div>';
  return h;
}
function closePlanner(){ closeRoute(); }

/* ================= voice commands ================= */
const ASR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null;
function listen(){
  if(!ASR){ toast("Voice commands need Chrome on Android."); return; }
  if(rec){ try{ rec.abort(); }catch(e){} rec=null; hideListen(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  rec=new ASR(); rec.lang=P().asr||"en-GB"; rec.interimResults=true; rec.maxAlternatives=1;
  let finalText="";
  showListen(P().v.listen, "");
  rec.onresult=e=>{ let t=""; for(const r of e.results){ t+=r[0].transcript; if(r.isFinal) finalText=t; } $("lsText").textContent=t; };
  rec.onerror=e=>{ hideListen(); rec=null;
    if(e.error==="not-allowed"||e.error==="service-not-allowed") toast("Microphone blocked. Allow the microphone for this app to use voice commands.");
    else if(e.error==="no-speech") toast(P().v.didnt); };
  rec.onend=()=>{ const t=finalText || $("lsText").textContent; rec=null; hideListen(); if(t.trim()) handleCommand(t.trim()); };
  try{ rec.start(); }catch(e){ rec=null; hideListen(); toast("Couldn't start the microphone."); }
}
function showListen(hint, text){ $("listen").hidden=false; $("lsHint").textContent=hint; $("lsText").textContent=text; }
function hideListen(){ $("listen").hidden=true; }
function reply(text, toastToo=true){ const was=S.voice; S.voice=true; say(text); S.voice=was; if(toastToo) toast(text); }

const HZ_WORDS = {
  police:/police|polis|mata|警察|馬打|马打|போலீஸ்/i, accident:/accident|crash|kemalangan|eksiden|车祸|車禍|撞车|撞車|விபத்து/i,
  flood:/flood|banjir|水灾|水災|水浸|积水|வெள்ளம்/i, pothole:/pothole|lubang|坑|窿|குழி/i, works:/road ?works?|kerja jalan|施工|修路|சாலைப் பணி/i,
  camera:/camera|kamera|awas|摄像|攝像|相機|相机|கேமரா/i, object:/object|debris|objek|杂物|雜物|பொருள்/i, jam:/\bjam\b|traffic jam|sesak|塞车|塞車|நெரிசல்/i };
async function handleCommand(raw){
  const t=raw.replace(/[。．.!！?？]+$/,"").trim(), low=t.toLowerCase(), v=P().v;
  showListen("", "“"+t+"”"); setTimeout(hideListen, 1200);
  // end navigation
  if(/\b(stop|end|cancel|quit)\b.*\b(nav|navigation|navigating|trip|route)\b|^(stop|end|cancel)( it)?$|berhenti|tamatkan|batalkan|停止导航|结束导航|停止導航|結束導航|唔使導航|நிறுத்து/i.test(t)){
    if(S.nav){ endNav(); reply(v.ended); } else if(S.dest){ closeRoute(); reply(v.ended); } else reply(v.noNav); return; }
  // arrival time
  if(/\b(eta|how long|when.*(arrive|reach|get there)|time left)\b|bila sampai|berapa lama|还要多久|還要多久|几时到|幾時到|几点到|幾點到|எப்போது|எவ்வளவு நேரம்/i.test(t)){
    if(!S.nav) return reply(v.noNav);
    return reply(v.eta(clock(new Date(Date.now()+S.lastLeft*1000)), fmtDur(S.lastLeft))); }
  // petrol cost
  if(/\b(petrol|fuel|gas|cost|how much)\b|minyak|kos|berapa ringgit|油钱|油錢|几多钱|幾多錢|多少钱|பெட்ரோல்|செலவு/i.test(t)){
    let u; if(S.nav){ const used=tripUse(S.drove,(Date.now()-S.navT0)/1000), left=tripUse(S.lastRemain,S.lastLeft);
      u={cost:used.cost+left.cost, sub: left.sub!=null? used.sub+left.sub : null}; }
    else if(S.routes.length){ u=tripUse(S.routes[S.sel].distance, S.routes[S.sel].duration); }
    else return reply(v.noNav);
    return reply(v.cost(u.cost.toFixed(2), u.sub!=null? u.sub.toFixed(2) : null)); }
  // add a stop on the way
  let m=t.match(/^(?:add (?:a )?stop(?: at)?|stop by|tambah hentian(?: di)?|singgah(?: di)?|加(?:一)?站|加入途经点|中途去|順路去|顺路去)\s*(.+)$/i);
  if(m){ const place=await firstPlace(m[1]); if(!place) return reply(v.notFound(m[1]));
    if(S.nav){ S.via=[place, ...remainingVia()]; drawStops(); reply(v.stopAdded(place.name)); S.lastReroute=0; reroute(S.pos||S.R.pts[0], true); }
    else { if(S.dest){ S.plan.stops=[place, S.dest]; } else { S.plan.stops=[place]; } S.plan.res=null; openPlanner(); calcPlan(); reply(v.stopAdded(place.name)); }
    return; }
  // home / work
  const home=/\b(go |take me |navigate )?home\b|balik rumah|pulang|回家|返屋企|வீட்டுக்கு/i.test(t), work=/\b(to )?(work|office)\b|pejabat|tempat kerja|pergi kerja|公司|上班|返工|வேலைக்கு/i.test(t);
  if((home||work) && t.length<30){ const k=home?"home":"work"; const pl=S.saved[k];
    if(!pl) return reply(v.noSaved(home?"Home":"Work")); return voiceGo(pl); }
  // report a hazard
  const isReport=/report|lapor|ada |there'?s|got |报告|報告|舉報|举报|前面有|தெரிவி/i.test(t) || !/\s/.test(t);
  if(isReport){ for(const [k,re] of Object.entries(HZ_WORDS)){ if(re.test(t)){ addReport(k); return reply(v.reported(hzSay(k))); } } }
  // navigate to a place
  const pats=[/^(?:please )?(?:navigate|navigation|directions?|drive|take me|bring me|go|let'?s go|head|route)\s*(?:me\s*)?(?:to|towards|for)?\s+(.+)$/i,
    /^(?:tolong )?(?:bawa saya ke|hantar saya ke|pergi ke|navigasi ke|jalan ke|saya nak pergi(?: ke)?|nak pergi(?: ke)?|ke)\s+(.+)$/i,
    /^(?:请|請)?(?:导航到|导航去|導航到|導航去|导航|導航|带我去|帶我去|我要去|我想去|揸去|車我去|去|到)\s*(.+)$/,
    /^(.+?)\s*(?:க்கு|கு)?\s*(?:வழிகாட்டு|போகணும்|போக வேண்டும்|போ|செல்)$/];
  let place=null; for(const re of pats){ const mm=t.match(re); if(mm){ place=mm[1].trim(); break; } }
  place = place || t;            // just a place name on its own
  const hit=await firstPlace(place); if(!hit) return reply(v.notFound(place));
  voiceGo(hit);
}
async function firstPlace(q){ try{ return (await searchPlaces(q))[0]||null; }catch(e){ return null; } }
/* hands-free: plan the fastest route and start straight away */
async function voiceGo(place){
  if(S.nav) endNav();
  closeSheet(); toggleLayers(false);
  await setDest(place);
  if(!S.routes.length || S.dest!==place) return;
  const R=S.routes[0]; reply(P().v.going(place.name, fmtDur(R.duration)), false);
  setTimeout(()=>{ if(S.dest===place && !S.nav) startNav(false); }, 2500);
}
function addReport(type){
  const p=S.pos||map.getCenter();
  S.reports.push({id:Date.now().toString(36), type, lat:p.lat, lng:p.lng, t:Date.now()});
  store.set("reports",S.reports); drawReports();
}
$("lsX").onclick=e=>{ e.stopPropagation(); if(rec){ try{ rec.abort(); }catch(_){} rec=null; } hideListen(); };
$("alertX").onclick=()=>{ $("alert").hidden=true; $("alertX").hidden=true; S.alertMutedUntil=Date.now()+60000; };
if(ASR){ $("micBtn").onclick=listen; $("navMic").onclick=listen; $("listen").onclick=()=>{ if(rec){ try{ rec.abort(); }catch(e){} } hideListen(); }; }
else { $("micBtn").hidden=true; $("navMic").hidden=true; }

try{ new ResizeObserver(setRest).observe($("top")); new ResizeObserver(setRest).observe($("tripbar")); }catch(e){}
addEventListener("resize", setRest);
/* ================= trip alerts: closures, accidents, floods, events on your route (TomTom incidents) ================= */
const INC = { 0:["⚠️","Incident","Insiden"], 1:["💥","Accident","Kemalangan"], 2:["🌫️","Fog","Kabus"], 3:["⚠️","Dangerous conditions","Keadaan bahaya"],
  4:["🌧️","Heavy rain","Hujan lebat"], 7:["🚧","Lane closed","Lorong ditutup"], 8:["⛔","Road closed","Jalan ditutup"], 9:["🚧","Roadworks","Kerja jalan"],
  10:["💨","Strong wind","Angin kencang"], 11:["🌊","Flooding","Banjir"], 14:["🚗","Broken-down vehicle","Kenderaan rosak"] };
const INC_HZ = {1:"accident", 7:"works", 9:"works", 11:"flood", 14:"object"};       // reuse the dialect words where we have them
function incLabel(c){ const x=INC[c]||INC[0]; return BASE()==="ms"? x[2] : x[1]; }
function incSay(c){ return c===8 ? P().jam.closed : INC_HZ[c] ? hzSay(INC_HZ[c]) : incLabel(c); }
let alertLayer=null;

/* split the route into boxes under TomTom's 10,000 km² limit */
function routeBoxes(R){
  const boxes=[]; let b=null;
  const area=x=> (x[3]-x[1])*111 * (x[2]-x[0])*111*Math.cos(rad((x[1]+x[3])/2));
  for(let i=0;i<R.pts.length;i+=3){ const p=R.pts[i];
    const nb = b ? [Math.min(b[0],p.lng),Math.min(b[1],p.lat),Math.max(b[2],p.lng),Math.max(b[3],p.lat)] : [p.lng,p.lat,p.lng,p.lat];
    if(b && area(nb)>8000){ boxes.push(b); b=[p.lng,p.lat,p.lng,p.lat]; } else b=nb; }
  const last=R.pts[R.pts.length-1]; if(b){ b=[Math.min(b[0],last.lng),Math.min(b[1],last.lat),Math.max(b[2],last.lng),Math.max(b[3],last.lat)]; boxes.push(b); }
  return boxes.slice(0,10).map(x=>[x[0]-.01,x[1]-.01,x[2]+.01,x[3]+.01]);
}
async function loadAlerts(R){
  if(!S.ttKey || !S.alertsOn || !R) return null;
  if(R.alerts && Date.now()-R.alertsAt < 6*60000) return R.alerts;
  const fields="{incidents{type,geometry{type,coordinates},properties{id,iconCategory,magnitudeOfDelay,events{description,code},startTime,endTime,from,to,length,delay,roadNumbers}}}";
  const feats=new Map();
  await Promise.all(routeBoxes(R).map(async bx=>{
    const url=TT+"/traffic/services/5/incidentDetails?key="+encodeURIComponent(S.ttKey)+"&bbox="+bx.map(v=>v.toFixed(5)).join(",")+
      "&fields="+encodeURIComponent(fields)+"&language=en-GB&timeValidityFilter=present,future&categoryFilter=0,1,2,3,4,7,8,9,10,11,14";
    try{ const j=await (await fetch(url)).json(); (j.incidents||[]).forEach(f=>feats.set(f.properties.id,f)); }catch(e){}
  }));
  // keep only incidents on (within ~120 m of) the route, happening now or before you'd get there
  const samp=[]; let lastAlong=-1e9;
  R.pts.forEach((p,i)=>{ if(R.cum[i]-lastAlong>=100 || i===R.pts.length-1){ samp.push(i); lastAlong=R.cum[i]; } });
  const now=Date.now(), until=now+R.duration*1000+2*3600e3, out=[];
  feats.forEach(f=>{ const pr=f.properties;
    if(pr.endTime && Date.parse(pr.endTime)<now) return;
    if(pr.startTime && Date.parse(pr.startTime)>until) return;
    const g=f.geometry, coords = g.type==="Point" ? [g.coordinates] : (g.coordinates||[]);
    let best=null;
    for(let c=0;c<coords.length;c+=Math.max(1,Math.floor(coords.length/12))){ const q={lat:coords[c][1], lng:coords[c][0]};
      for(const i of samp){ const p=R.pts[i]; const dx=(p.lng-q.lng)*111320*Math.cos(rad(q.lat)), dy=(p.lat-q.lat)*110540;
        if(dx*dx+dy*dy < 120*120 && (!best || i<best.i)){ best={i, at:q}; break; } } }
    if(!best) return;
    const ev=(pr.events||[])[0]||{};
    out.push({id:pr.id, cat:pr.iconCategory, mag:pr.magnitudeOfDelay||0, desc:ev.description||"", from:pr.from||"", to:pr.to||"",
      delay:pr.delay||0, start:pr.startTime, end:pr.endTime, road:(pr.roadNumbers||[])[0]||"", i:best.i, along:R.cum[best.i], at:best.at,
      future: pr.startTime && Date.parse(pr.startTime)>now });
  });
  out.sort((a,b)=>a.along-b.along);
  R.alerts=out; R.alertsAt=Date.now(); return out;
}
function drawAlerts(R){
  if(!alertLayer) alertLayer=L.layerGroup().addTo(map);
  alertLayer.clearLayers();
  (R && R.alerts || []).forEach(a=>{
    const m=L.marker(a.at,{icon:L.divIcon({className:"",html:'<div class="incpin'+(a.cat===8?" closed":"")+'">'+(INC[a.cat]||INC[0])[0]+'</div>',iconSize:[32,32],iconAnchor:[16,16]})}).addTo(alertLayer);
    m.bindPopup('<div class="pop"><b>'+esc(incLabel(a.cat))+'</b><div style="font-size:13px">'+esc(alertDetail(a))+'</div></div>');
  });
}
function hm(t){ try{ const d=new Date(t); return d.toLocaleString("en-MY",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit",hour12:false}); }catch(e){ return ""; } }
function alertDetail(a){
  const parts=[];
  if(a.desc && a.desc.toLowerCase()!==incLabel(a.cat).toLowerCase()) parts.push(a.desc);
  const where=[a.road, a.from && a.to && a.from!==a.to ? a.from+" → "+a.to : a.from].filter(Boolean).join(" · "); if(where) parts.push(where);
  if(a.future && a.start) parts.push("from "+hm(a.start)); else if(a.end) parts.push("until "+hm(a.end));
  if(a.delay>=60) parts.push("+"+Math.round(a.delay/60)+" min");
  return parts.join(" · ");
}
/* the list shown on route cards and in the trip planner */
function alertsHTML(R, fromAlong=0){
  if(!S.alertsOn) return "";
  if(!S.ttKey) return '<div class="alerts muted">⚠️ Add a free TomTom key in ⚙ to get alerts about road closures, accidents, floods and events on your route.</div>';
  if(!R.alerts) return '<div class="alerts muted">Checking for road closures, accidents, floods and events on your route…</div>';
  const list=R.alerts.filter(a=>a.along>=fromAlong-50);
  if(!list.length) return '<div class="alerts ok">✓ No road closures, accidents, floods or events reported on this route.</div>';
  let h='<div class="alerts"><div class="ahead">⚠️ '+list.length+' alert'+(list.length>1?"s":"")+' on this route</div><ul>';
  list.slice(0,8).forEach(a=> h+='<li class="'+(a.cat===8?"closed":"")+'"><i>'+(INC[a.cat]||INC[0])[0]+'</i><div><b>'+esc(incLabel(a.cat))+' · in '+fmtDist(Math.max(0,a.along-fromAlong))+'</b><span>'+esc(alertDetail(a))+'</span></div></li>');
  if(list.length>8) h+='<li class="more">+'+(list.length-8)+' more on the map</li>';
  return h+'</ul></div>';
}
/* while driving: warn about the next alert within 2 km */
function alertCheck(near){
  const R=S.R; if(!R || !R.alerts || !R.alerts.length) return false;
  const next=R.alerts.find(a=>a.along > near.along-30 && !a.future);
  if(!next) return false;
  const d=next.along-near.along; if(d>2000) return false;
  const a=$("alert"); a.hidden=false; a.style.background=next.cat===8?"#8b1a12":"var(--amber)"; a.style.color=next.cat===8?"#fff":"#2a1d00";
  a.innerHTML='<span style="font-size:24px">'+(INC[next.cat]||INC[0])[0]+'</span><span>'+esc(incLabel(next.cat))+' · '+fmtDist(Math.max(0,d))+(next.delay>=60?' · +'+Math.round(next.delay/60)+' min':'')+'</span>';
  if(!S.alertSaid) S.alertSaid={};
  if(!S.alertSaid[next.id] && d<1600){ S.alertSaid[next.id]=1; say(P().hazard(incSay(next.cat))); }
  return true;
}
/* fetch alerts for a route, then refresh whatever is on screen */
function withAlerts(R, after){ if(!S.ttKey || !S.alertsOn) return; loadAlerts(R).then(()=>{ drawAlerts(R); after && after(); }); }

/* keep known alerts when the route is recalculated mid-drive; fetch fresh ones at most every 6 minutes */
function carryAlerts(oldR, newR){
  if(!S.alertsOn || !S.ttKey) return;
  if(!oldR || !oldR.alerts || Date.now()-(S.navAlertsAt||0) > 6*60000){ S.navAlertsAt=Date.now(); withAlerts(newR); return; }
  newR.alerts = oldR.alerts.map(a=>{ const n=nearest(newR, a.at, 0); return n.d<150 ? {...a, i:n.i, along:n.along} : null; }).filter(Boolean).sort((x,y)=>x.along-y.along);
  newR.alertsAt = oldR.alertsAt;
}
/* ================= boot ================= */
if(!PACKS[S.lang]){ S.lang = ({kelantan:"ms",kedah:"ms",manglish:"en"})[S.lang]||"en"; store.set("lang",S.lang); }
// move older saved settings (separate subsidised/market fuel types) to the new format
{ const old=S.fuel.type, map={ron95b:"ron95", dieselb:"diesel"};
  if(map[old] || !FUELS[old] || S.fuel.sub===undefined || !("v2" in S.fuel)){ setFuelType(map[old] || (FUELS[old]? old : "ron95")); S.fuel.v2=1; store.set("fuel",S.fuel); }
  if(!CARS[S.fuel.car]) S.fuel.car="custom";
  if(FUELS[S.fuel.type].s==null) S.fuel.sub=null; }
applyReportBtn(); paintToggles(); paintCompass(); renderChips(); loadReports(); applyMapStyle(); startGPS(); setRest();setInterval(loadReports, 60000);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.protocol==="file:") setTimeout(()=>toast("Open this page over https (e.g. GitHub Pages) so your phone allows GPS."), 1500);
</script>
