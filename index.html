<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#006a4e">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jalan Nav</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed map; floating search on top, bottom sheet for routes; during nav a JKR-green "expressway sign" banner on top and a trip bar below. */
:root{
  --sign:#006a4e; --sign-deep:#004d39; --sign-ink:#ffffff; --signtext:#006a4e;
  --amber:#f2a900; --danger:#d93b2b;
  --bg:#eef2f0; --surface:#ffffff; --fg:#10201a; --muted:#5a6b63; --line:#dbe3df;
  --route:#1b7cf2; --route-alt:#9aa9a2;
  --shadow:0 6px 24px rgba(10,30,20,.18);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
/* Map style decides the app theme: auto follows the phone; normal = light; dark; clean = Tesla-like charcoal */
@media (prefers-color-scheme:dark){:root:not([data-theme]){
  --sign:#0c7d5c; --sign-deep:#065a42; --signtext:#4cc79a;
  --bg:#0e1412; --surface:#18211d; --fg:#e6eeea; --muted:#93a39b; --line:#2a3631;
  --route:#4d9dff; --route-alt:#5c6c65; --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --sign:#0c7d5c; --sign-deep:#065a42; --signtext:#4cc79a;
  --bg:#0e1412; --surface:#18211d; --fg:#e6eeea; --muted:#93a39b; --line:#2a3631;
  --route:#4d9dff; --route-alt:#5c6c65; --shadow:0 6px 24px rgba(0,0,0,.5);
  color-scheme:dark;
}
:root[data-theme="clean"]{
  --sign:#26272b; --sign-deep:#3a3b40; --sign-ink:#ffffff; --signtext:#f2f2f3;
  --bg:#121214; --surface:#1d1e21; --fg:#f2f2f3; --muted:#9a9ba1; --line:#2e2f34;
  --route:#3e8bff; --route-alt:#55575e; --shadow:0 8px 28px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
/* filters touch only the base map, never traffic or the route */
.base-osm-dark{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.5)}
.base-osm-clean{filter:grayscale(1) invert(1) brightness(.9) contrast(.85)}
.base-tt-clean{filter:grayscale(1) brightness(.92) contrast(1.08)}
.base-osm-light{filter:saturate(.75) brightness(1.03)}
:root[data-theme="clean"] .sign-in{border-color:rgba(255,255,255,.18)}
:root[data-theme="clean"] .sign{box-shadow:0 10px 30px rgba(0,0,0,.6)}
:root[data-theme="clean"] .fab.report{background:#2c2d31;color:var(--amber)}
.styles{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:8px}
.sopt{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px;border-radius:12px;border:2px solid var(--line);text-align:center;font-size:13px;font-weight:600;min-width:0}
.sopt.sel{border-color:var(--route)}
.sopt i{display:block;height:46px;border-radius:8px;position:relative;overflow:hidden}
.sopt i::after{content:"";position:absolute;left:10%;right:30%;top:55%;height:4px;border-radius:2px;background:#3e8bff;transform:rotate(-14deg)}
.sw-auto{background:linear-gradient(135deg,#eef0ec 50%,#1b2430 50%)}
.sw-normal{background:#eef0ec repeating-linear-gradient(90deg,transparent 0 22px,#fff 22px 26px)}
.sw-dark{background:#1b2430 repeating-linear-gradient(90deg,transparent 0 22px,#34445a 22px 26px)}
.sw-clean{background:#151517 repeating-linear-gradient(90deg,transparent 0 22px,#3a3b40 22px 25px)}
.sw-osm{background:#f2efe9 repeating-linear-gradient(60deg,transparent 0 14px,#f7d39a 14px 17px,transparent 17px 30px,#fff 30px 33px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--route);outline-offset:2px}
#map{position:fixed;inset:0;background:var(--bg)}
/* 3D driving view: the map is enlarged and tipped back so the road ahead recedes into the distance */
body.tilted #map{inset:auto;top:-42%;left:-45%;width:190%;height:180%;transform-origin:50% 60%;transform:perspective(1100px) rotateX(46deg)}
body.tilted .me svg{transform:scale(1.7)}
body.tilted .leaflet-control-container{display:none}
body.tilted .incpin, body.tilted .hzpin, body.tilted .stoppin, body.tilted .lm{transform:rotateX(-46deg);transform-origin:50% 100%}
body.tilted .lm{transform:translate(-50%,-50%) rotateX(-46deg)}
#attrFixed{position:fixed;z-index:450;left:max(8px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,24px) + 6px);font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 6px;border-radius:4px}
.lrow.tilt{margin-top:8px}
.leaflet-container{background:var(--bg);font-family:var(--f-body)}
.leaflet-control-attribution{font-size:10px}
.leaflet-bottom{margin-bottom:calc(var(--sheet-h,24px) + env(safe-area-inset-bottom,0px));transition:margin .25s}
/* Focus: soft pastel colours with crisp contrast (parks stay light green, water light blue) */
.base-tt-focus,.base-osm-focus{filter:grayscale(1) brightness(1.07) contrast(.8);opacity:.62}
.sw-sat{background:radial-gradient(circle at 30% 30%,#5b7d4a,#2f4a2c 60%,#3b5a6e)}
.lm{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;white-space:nowrap;padding:3px 8px 3px 4px;border-radius:999px;
  background:rgba(255,255,255,.92);color:#1d2b3a;font:600 11.5px var(--f-body);box-shadow:0 1px 4px rgba(0,0,0,.25);border:1px solid rgba(0,0,0,.06);pointer-events:none}
.lm i{font-style:normal;font-size:14px;line-height:1}
.sw-focus{background:#eceef0 repeating-linear-gradient(90deg,transparent 0 22px,#fafafa 22px 26px)}

/* ---------- search bar, at the bottom within thumb reach ---------- */
#top{position:fixed;z-index:500;left:0;right:0;bottom:0;
  padding:28px max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;
  background:linear-gradient(to top, color-mix(in srgb, var(--bg) 70%, transparent) 40%, transparent)}
#top>*{pointer-events:auto}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:6px 6px 6px 14px}
.searchbox input::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.searchbox input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font:500 16px var(--f-body);padding:8px 0;outline:none}
.searchbox .brand{font:700 18px var(--f-display);color:var(--signtext);letter-spacing:.02em}
.iconbtn{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.iconbtn:hover{background:var(--bg)}
#results{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;max-height:min(50vh,360px);overflow-y:auto}
#results:not([hidden]) ~ .chips{display:none}
#results button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
#results button:last-child{border-bottom:0}
#results b{display:block;font-weight:600}
#results span{color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--surface);border-radius:999px;padding:7px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-weight:500;font-size:13px;white-space:nowrap}
.chip.home{background:var(--sign);color:var(--sign-ink)}

/* ---------- floating buttons ---------- */
#fabs{position:fixed;z-index:500;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + var(--sheet-h,24px) + 12px);display:flex;flex-direction:column;gap:10px;transition:bottom .25s}
.fab{width:52px;height:52px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font:700 13px var(--f-display);letter-spacing:.04em}
.fab.report{background:var(--amber);color:#2a1d00;font-size:24px}
.fab.on{color:var(--route)}
.fab svg{width:24px;height:24px}

/* ---------- bottom sheet ---------- */
#sheet{position:fixed;z-index:760;left:0;right:0;bottom:var(--tabh,0px);background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));
  max-height:calc(78vh - var(--tabh,0px));overflow-y:auto;transform:translateY(0);transition:transform .25s}
#sheet.closed{transform:translateY(110%)}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.dest h2{margin:0;font:700 24px/1.1 var(--f-display);text-wrap:balance}
.dest p{margin:2px 0 10px;color:var(--muted);font-size:13px}
.routes{display:flex;flex-direction:column;gap:8px}
.rcard{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:14px}
.rcard.sel{border-color:var(--route)}
.rcard .t{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.rcard .d{font:600 15px var(--f-display);color:var(--muted);align-self:center;font-variant-numeric:tabular-nums}
.rcard .via{grid-column:1/-1;color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{font:700 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--amber);color:#2a1d00}
.tag.fast{background:var(--sign);color:var(--sign-ink)}
.tag.ok{background:#1f9d55;color:#fff}
.tag.mod{background:#f07a1a;color:#fff}
.tag.bad{background:var(--danger);color:#fff}
.tag.off{background:var(--line);color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-weight:600;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--f-body)}
.status{display:flex;align-items:center;gap:8px;margin:4px 0 0;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.dot.on{background:#1f9d55}.dot.err{background:var(--danger)}
.steps{margin:8px 0 0;padding-left:20px;color:var(--muted);font-size:14px}
.steps li{margin:3px 0}
.sheethead{position:sticky;top:-10px;z-index:3;background:var(--surface);margin:-10px -4px 4px;padding:10px 4px 6px;display:flex;justify-content:center;align-items:center;touch-action:none;cursor:grab}
.sheethead .grab{margin:0;width:44px;height:5px}
.sheetx{position:absolute;right:0;top:4px;width:38px;height:38px;border-radius:50%;background:var(--bg);font-size:16px;display:grid;place-items:center}
.layers{position:absolute;right:64px;top:0;width:min(300px,calc(100vw - 100px));background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px}
.lhead{font:700 15px var(--f-display);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lgrid .sopt{padding:4px;font-size:12px}
.lgrid .sopt i{height:34px}
.ltraffic{margin-top:10px}
.fab.traffic{color:var(--muted)}
.fab.traffic.on{color:#fff;background:#1f9d55}
.tripcost{color:var(--fg);font-weight:600}
.fuelline{grid-column:1/-1;font-size:13px;font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums;margin-top:2px}
h3.sec{margin:18px 0 2px;font:700 18px var(--f-display);letter-spacing:.02em;color:var(--signtext)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--f-body)}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vopt{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;border-radius:12px;border:2px solid var(--line);min-width:0}
.vopt b{font:700 16px var(--f-display)}
.vopt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vopt.sel{border-color:var(--route)}
.toggle span{color:var(--fg)}
.compass svg{transition:transform .3s}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{flex:1;min-width:0;padding:13px 14px;border-radius:12px;font-weight:600;background:var(--bg)}
.gotop{margin:4px 0 6px}
.routes{margin-top:10px}
.btn.go{background:var(--route);color:#fff;font:700 18px var(--f-display);letter-spacing:.05em;flex:2}
.btn.small{flex:none;padding:9px 12px;font-size:13px}
.toggle{display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--signtext)}

/* ---------- navigation UI ---------- */
#navsign{position:fixed;z-index:700;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.sign{background:var(--sign);color:var(--sign-ink);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
.sign-in{border:2px solid rgba(255,255,255,.9);border-radius:8px;display:flex;align-items:center;gap:10px;padding:5px 8px;min-height:62px}
.arrow{flex:none;width:44px;height:44px;display:grid;place-items:center}
.arrow svg{width:42px;height:42px;transition:transform .2s}
.sign .dist{font:700 27px/1 var(--f-display);font-variant-numeric:tabular-nums}
.sign .ins{font:600 16px/1.1 var(--f-display);text-wrap:balance}
.sign .road{font-size:12px;opacity:.85;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next{margin:6px 0 0 8px;display:inline-flex;gap:6px;align-items:center;background:var(--sign-deep);color:var(--sign-ink);font:600 14px var(--f-display);padding:5px 10px;border-radius:8px}
#alert{margin-top:8px;background:var(--amber);color:#2a1d00;border-radius:12px;padding:10px 14px;font:600 16px var(--f-display);box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
#tripbar{position:fixed;z-index:700;left:0;right:0;bottom:0;background:var(--surface);box-shadow:var(--shadow);border-radius:18px 18px 0 0;column-gap:10px;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:10px}
.speed{flex:none;width:58px;height:58px;border-radius:50%;border:4px solid var(--danger);display:grid;place-items:center;text-align:center;line-height:1}
.speed b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.speed small{font-size:9px;color:var(--muted);display:block}
.eta{flex:1;min-width:0}
.eta .big{font:700 26px/1 var(--f-display);color:var(--signtext);font-variant-numeric:tabular-nums}
.eta .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.btn.end{flex:none;background:var(--danger);color:#fff;padding:12px 14px}

/* ---------- report sheet ---------- */
.hzgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hz{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 4px;border-radius:14px;background:var(--bg);font-size:12px;font-weight:600;text-align:center}
.hz i{font-style:normal;font-size:28px}
.hint{color:var(--muted);font-size:13px;margin:10px 0 0}

/* ---------- map markers ---------- */
.me{width:34px;height:34px;pointer-events:none}
.me svg{width:34px;height:34px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.me.car{width:30px;height:52px}
.me.car svg{width:30px;height:52px;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
.lrow{display:flex;gap:6px;margin-top:8px}
.lrow button{flex:1;padding:8px 6px;border-radius:10px;border:2px solid var(--line);font-weight:600;font-size:13px}
.lrow button.sel{border-color:var(--route)}
.hzpin{font-size:22px;width:38px;height:38px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3);border:2px solid var(--amber)}
.destpin{width:22px;height:22px;border-radius:50%;background:var(--danger);border:4px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg)}
.pop b{font:700 16px var(--f-display)}
.pop .row{margin-top:8px}

/* trip planner */
.stops{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.stop{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start}
.stop .sn{width:26px;height:26px;margin-top:9px;border-radius:50%;background:var(--route);color:#fff;display:grid;place-items:center;font:700 13px var(--f-body)}
.stop.start .sn{background:var(--signtext)}
.stop .sn.fin{background:transparent;font-size:18px}
.si{min-width:0;position:relative}
.si input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:500 15px var(--f-body)}
.si .here{padding:11px 0;font-weight:600}
.sres{margin-top:4px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sres button{display:block;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
.sres button:last-child{border-bottom:0}
.sres b{display:block;font-weight:600}.sres span{color:var(--muted);font-size:12px}
.sres .none{padding:9px 12px;color:var(--muted)}
.sbtn{display:flex;gap:2px;margin-top:4px}
.sbtn button{width:30px;height:34px;border-radius:8px;color:var(--muted);font-weight:700}
.sbtn button:disabled{opacity:.3}
.addstop{margin-top:8px;align-self:flex-start}
.tsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tsum div,.tcost div{display:flex;flex-direction:column;gap:2px;min-width:0}
.tsum b{font:700 22px var(--f-display);font-variant-numeric:tabular-nums}
.tsum span,.tcost span{font-size:12px;color:var(--muted)}
.tcost{display:flex;gap:16px;align-items:flex-end;margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);flex-wrap:wrap}
.tcost b{font:700 20px var(--f-display);font-variant-numeric:tabular-nums}
.tcost div:first-child span{font-size:14px;color:var(--fg);font-weight:600}
.legs{margin:12px 0 0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
.legs li b{display:block;font-weight:600}.legs li span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stoppin{width:26px;height:26px;border-radius:50%;background:var(--route);color:#fff;border:3px solid #fff;display:grid;place-items:center;font:700 12px var(--f-body);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.chip.plan{background:var(--route);color:#fff}
/* voice commands */
.iconbtn.mic svg{width:22px;height:22px}
.navmic{flex:none;width:44px;height:44px;border-radius:50%;background:var(--bg)}
.listen{position:fixed;z-index:950;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 90px);
  background:var(--surface);color:var(--fg);border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center}
.lsdot{flex:none;width:52px;height:52px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;animation:pulse 1.2s ease-in-out infinite}
.lsdot svg{width:26px;height:26px}
.lsbody{min-width:0}.lshint{color:var(--muted);font-size:13px}.lstext{font:600 18px/1.25 var(--f-body);word-wrap:break-word}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,59,43,.45)}50%{box-shadow:0 0 0 12px rgba(217,59,43,0)}}

<script>

};

(function(){

})();

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const rad = d => d*Math.PI/180;
function hav(a,b){ const R=6371000, dLa=rad(b.lat-a.lat), dLo=rad(b.lng-a.lng);
  const x=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function bearing(a,b){ const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));
  const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));
  return (Math.atan2(y,x)*180/Math.PI+360)%360; }
function segProj(p,a,b){ const k=Math.cos(rad(p.lat));
  const ax=(a.lng-p.lng)*k*111320, ay=(a.lat-p.lat)*110540, bx=(b.lng-p.lng)*k*111320, by=(b.lat-p.lat)*110540;
  const dx=bx-ax, dy=by-ay, L=dx*dx+dy*dy; let t=L ? -(ax*dx+ay*dy)/L : 0; t=Math.max(0,Math.min(1,t));
  return {d:Math.hypot(ax+t*dx, ay+t*dy), t}; }
function fmtDist(m){ if(m<1000) return (m<100? Math.round(m/10)*10 : Math.round(m/50)*50)+" m"; return (m<10000? (m/1000).toFixed(1) : Math.round(m/1000))+" km"; }
function fmtDur(s){ const m=Math.round(s/60); if(m<60) return m+" min"; return Math.floor(m/60)+" h "+(m%60)+" min"; }
function clock(d){ return d.toLocaleTimeString("en-MY",{hour:"2-digit",minute:"2-digit",hour12:false}); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let toastT; function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),3200); }

/* ================= map ================= */
const sysDark = matchMedia("(prefers-color-scheme: dark)");
const map = L.map("map",{zoomControl:false, attributionControl:true, rotate:true, bearing:0, touchRotate:false, rotateControl:false, shiftKeyRotate:false, compassBearing:false}).setView([3.139,101.6869],12);
const CAN_ROTATE = typeof map.setBearing==="function";
const NORTH_SIGN = 1;   // leaflet-rotate: bearing b turns the map so north points b° clockwise on screen
/* ---- base map styles ---- */
const MAP_STYLES = {
  focus: {n:"Focus",  d:"Waze-style: the map fades to grey so only your route, its traffic and major landmarks stand out"},
  auto:  {n:"Auto",   d:"Follows your phone's light or dark mode"},
  normal:{n:"Normal", d:"Standard light map"},

};
const OSM_ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
let baseLayer=null, baseErrs=0, satLabels=null;

/* major landmarks, shown as small labels in Focus style when zoomed in (approximate positions) */
const LANDMARKS=[
  ["🏙️","Petronas Twin Towers",3.1579,101.7116],["🏙️","Merdeka 118",3.1414,101.7005],["🗼","KL Tower",3.1528,101.7038],["🏙️","Exchange 106",3.1419,101.7183],
  ["🚉","KL Sentral",3.1340,101.6862],["🛍️","Pavilion KL",3.1490,101.7134],["🛍️","Mid Valley Megamall",3.1176,101.6773],["🛍️","Sunway Pyramid",3.0730,101.6070],
  ["🕌","Masjid Negara",3.1420,101.6918],["🇲🇾","Dataran Merdeka",3.1478,101.6935],["🏟️","Bukit Jalil National Stadium",3.0549,101.6913],["⛰️","Batu Caves",3.2379,101.6840],
  ["🕌","Putra Mosque",2.9360,101.6897],["✈️","KLIA Terminal 1",2.7456,101.7072],["✈️","KLIA Terminal 2",2.7437,101.6853],["🏁","Sepang Circuit",2.7606,101.7381],
  ["🎰","Genting Highlands",3.4236,101.7932],["🌉","Penang Bridge",5.3550,100.3470],["🏢","Komtar",5.4145,100.3290],["⛰️","Penang Hill",5.4240,100.2680],
  ["🏰","A Famosa, Melaka",2.1916,102.2508],["🛂","JB CIQ",1.4630,103.7640],["🎢","Legoland Malaysia",1.4269,103.6297]];
let lmLayer=null;
function drawLandmarks(){
  if(!lmLayer) lmLayer=L.layerGroup();
  lmLayer.clearLayers();
  const show = styleKind()==="focus" && map.getZoom()>=13;
  if(!show){ lmLayer.remove(); return; }
  const b=map.getBounds().pad(0.2);
  const placed=[];   // skip a label that would overlap one already shown
  LANDMARKS.forEach(([e,n,la,lo])=>{ if(!b.contains([la,lo])) return;
    const pt=map.latLngToContainerPoint([la,lo]), w=n.length*6.5+30;
    if(placed.some(q=>Math.abs(q.x-pt.x)<(q.w+w)/2+6 && Math.abs(q.y-pt.y)<26)) return; placed.push({x:pt.x,y:pt.y,w});
    L.marker([la,lo],{interactive:false, keyboard:false, icon:L.divIcon({className:"", iconSize:[0,0], html:'<div class="lm"><i>'+e+'</i>'+esc(n)+'</div>'})}).addTo(lmLayer); });
  lmLayer.addTo(map);
}
let lmT; map.on("zoomend moveend", ()=>{ clearTimeout(lmT); lmT=setTimeout(drawLandmarks, 350); });
function styleKind(){ const st=MAP_STYLES[S.mapStyle]? S.mapStyle : "auto"; return st==="auto" ? (sysDark.matches? "dark":"normal") : st; }
function applyMapStyle(){
  const kind=styleKind(), k=S.ttKey && baseErrs<8 ? encodeURIComponent(S.ttKey) : "";
  if(baseLayer) baseLayer.remove();
  let url, opt={maxZoom:19, attribution:OSM_ATTR+" · Routing OSRM"};
  if(satLabels){ satLabels.remove(); satLabels=null; }
  if(kind==="sat"){
    if(k && !S.satFallback){ url=TT+"/map/1/tile/sat/main/{z}/{x}/{y}.jpg?key="+k; opt={maxZoom:19, attribution:"Imagery &copy; TomTom"}; }
    else { url="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"; opt={maxZoom:19, attribution:"Imagery &copy; Esri, Maxar, Earthstar Geographics"}; }
    if(k) satLabels=L.tileLayer(TT+"/map/1/tile/labels/main/{z}/{x}/{y}.png?key="+k+"&tileSize=512",{maxZoom:20, zIndex:3}).addTo(map);
  } else if(kind!=="osm" && k){
    url=TT+"/map/1/tile/basic/"+(kind==="normal"||kind==="focus"?"main":"night")+"/{z}/{x}/{y}.png?key="+k+"&tileSize=512";
    // tileSize=512 here means a sharp high-resolution tile for the same area, shown at normal 256 px size
    opt={maxZoom:20, attribution:"&copy; TomTom", className: kind==="clean"?"base-tt-clean" : kind==="focus"?"base-tt-focus" : ""};
  } else {
    url="https://tile.openstreetmap.org/{z}/{x}/{y}.png";
    opt.className = kind==="dark"?"base-osm-dark" : kind==="clean"?"base-osm-clean" : kind==="focus"?"base-osm-focus" : kind==="normal"?"base-osm-light" : "";
  }
  baseLayer=L.tileLayer(url,opt).addTo(map);
  let errs=0;
  baseLayer.on("tileerror", ()=>{ if(!url.includes("tomtom") || ++errs!==6) return;
    if(kind==="sat"){ S.satFallback=true; toast("TomTom satellite isn't on your plan, so Esri satellite imagery is shown."); }
    else { baseErrs=8; toast("TomTom map tiles unavailable, so OpenStreetMap is shown."); }
    applyMapStyle(); });

  if(S.mapStyle==="auto") delete root.dataset.theme; else root.dataset.theme = kind==="clean"?"clean" : (kind==="dark"||kind==="sat")?"dark" : "light";
  drawLandmarks();
  const mc=document.querySelector('meta[name="theme-color"]'); if(mc) mc.content = getVar("--sign");
  applyTrafficLayer();
  if(S.R && S.nav) drawNavRoute(); else if(S.routes && S.routes.length) drawRoutes();
}
sysDark.addEventListener?.("change", ()=>{ if(S.mapStyle==="auto") applyMapStyle(); });
map.on("dragstart", ()=>{ S.freeFollow=false; if(S.safe) S.dragAt=Date.now(); if(S.nav){ S.follow=false; S.dragAt=Date.now(); } $("locBtn").classList.remove("on"); applyTilt(); });
map.on("rotate", ()=>{ paintCompass(); paintArrow(); });
map.on("contextmenu", e => setDest({name:"Dropped pin", sub:e.latlng.lat.toFixed(5)+", "+e.latlng.lng.toFixed(5), lat:e.latlng.lat, lng:e.latlng.lng}));

const ARROW_ME = '<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="#fff"/><circle cx="17" cy="17" r="12" fill="#1b7cf2"/><path d="M17 7l6.5 15L17 18.5 10.5 22z" fill="#fff"/></svg>';
/* top-view car (original drawing): body, glass roof, windscreen, lights; points up like the arrow */
const CAR_ME = '<svg viewBox="0 0 30 52" width="30" height="52"><defs><linearGradient id="cb" x1="0" x2="1"><stop offset="0" stop-color="#c9ced6"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#c9ced6"/></linearGradient></defs>'+
  '<rect x="2" y="2" width="26" height="48" rx="11" fill="url(#cb)" stroke="#6b7480" stroke-width="1.2"/>'+
  '<path d="M6 15 Q15 10 24 15 L22.5 22 Q15 19.5 7.5 22 Z" fill="#1e2a38"/>'+
  '<rect x="7.5" y="22.5" width="15" height="14" rx="3" fill="#2b3a4d"/>'+
  '<path d="M7.5 38 Q15 40 22.5 38 L23.5 43 Q15 46 6.5 43 Z" fill="#1e2a38"/>'+
  '<rect x="5" y="3.5" width="5" height="2.6" rx="1.3" fill="#e9f3ff"/><rect x="20" y="3.5" width="5" height="2.6" rx="1.3" fill="#e9f3ff"/>'+
  '<rect x="5" y="46" width="5" height="2.2" rx="1.1" fill="#e2453a"/><rect x="20" y="46" width="5" height="2.2" rx="1.1" fill="#e2453a"/>'+
  '<rect x="0" y="17" width="3" height="4" rx="1.5" fill="#9aa3ad"/><rect x="27" y="17" width="3" height="4" rx="1.5" fill="#9aa3ad"/></svg>';
function makeMeIcon(){ const car=S.carIcon==="car";
  return L.divIcon({className:"", html:'<div class="me'+(car?" car":"")+'" id="meEl">'+(car?CAR_ME:ARROW_ME)+'</div>', iconSize:car?[30,52]:[34,34], iconAnchor:car?[15,26]:[17,17]}); }
const meIcon = makeMeIcon();

let meMarker=null, accCircle=null, destMarker=null, routeLines=[], hzLayer=L.layerGroup().addTo(map);

/* live traffic layer on the map (TomTom flow + incident tiles) */
let trafficLayers=[];
function applyTrafficLayer(){
  trafficLayers.forEach(l=>l.remove()); trafficLayers=[];
  if(!$("layers").hidden) renderLayers();
  const on=S.showTraffic && !!S.ttKey; $("trafficBtn").classList.toggle("on",on); $("trafficBtn").setAttribute("aria-pressed",on);
  if(!S.ttKey || !S.showTraffic) return;
  const k=encodeURIComponent(S.ttKey);

  trafficLayers.push(L.tileLayer(TT+"/traffic/map/4/tile/flow/relative-delay/{z}/{x}/{y}.png?key="+k+"&thickness=4&tileSize=512",
    {maxZoom:20, opacity:.75, zIndex:5, attribution:"Traffic &copy; TomTom"}).addTo(map));

/* ================= location ================= */
function startGPS(){
  if(!("geolocation" in navigator)){ toast("This browser has no GPS access."); return; }
  S.watchId = navigator.geolocation.watchPosition(p => {
    if(S.sim) return;
    onPos({lat:p.coords.latitude, lng:p.coords.longitude}, p.coords.heading, p.coords.speed, p.coords.accuracy);
  }, err => {
    if(err.code===1) toast("Location blocked. Allow location for this site to navigate.");
    else toast("Waiting for GPS signal…");
  }, {enableHighAccuracy:true, maximumAge:1000, timeout:20000});
}
function onPos(p, heading, speed, acc){
  if(S.pos && hav(S.pos,p)>3) S.heading = (heading!=null && !isNaN(heading)) ? heading : bearing(S.pos,p);
  else if(heading!=null && !isNaN(heading)) S.heading = heading;
  S.speed = speed!=null && !isNaN(speed) ? speed : S.speed;
  S.pos = p; if(acc) S.acc=acc;
  const shown = snapToRoute(p, acc);          // while navigating, sit the car on the road like other nav apps
  if(!meMarker){ meMarker=L.marker(shown,{icon:meIcon, zIndexOffset:1000, keyboard:false, interactive:false}).addTo(map); S.disp=shown; }
  glideTo(shown);

/* route from → (stops) → to. opts.via overrides the current stops; opts.best asks for the quickest visiting order */
async function fetchRoutes(from,to,alts=2,opts={}){
  const pts=[from, ...(opts.via ?? S.via ?? []), to], best=!!opts.best && pts.length>3;
  if(S.ttKey){
    try{ const r=await fetchTomTom(pts,alts,best); S.ttStatus="ok"; return r; }
    catch(e){ S.ttStatus="err"; toast("Live traffic unavailable: "+e.message+". Showing routes without traffic."); }
  }

}
async function fetchTomTom(pts,alts,best,noToll){
  if(!Array.isArray(pts)) pts=[pts,alts], alts=best, best=false;          // old (from,to,alts) form
  if(pts.length>2) alts=0;                                                 // alternatives aren't offered with stops
  const url = TT+"/routing/1/calculateRoute/"+pts.map(p=>p.lat.toFixed(6)+","+p.lng.toFixed(6)).join(":")+
    "/json?key="+encodeURIComponent(S.ttKey)+"&traffic=true&travelMode=car&routeType=fastest&maxAlternatives="+alts+
    "&instructionsType=text&language=en-GB&computeTravelTimeFor=all&sectionType=traffic"+(noToll?"":"&sectionType=toll&sectionType=speedLimit&sectionType=lanes")+
    (best?"&computeBestOrder=true":"")+(S.avoidTolls?"&avoid=tollRoads":"")+(S.avoidHwy?"&avoid=motorways":"")+(S.avoidFerry?"&avoid=ferries":"")+
    (S.departAt && S.departAt>Date.now()+60000 ? "&departAt="+encodeURIComponent(new Date(S.departAt).toISOString()) : "");
  const res = await fetch(url);
  if(!res.ok){
    if(res.status===400 && !noToll) return fetchTomTom(pts,alts,best,true);
    let msg=""; try{ const j=await res.json(); msg=j.detailedError?.message||j.error?.description||""; }catch(e){}
    throw new Error(res.status===403||res.status===401 ? "the TomTom key was rejected" : res.status===429 ? "the free daily limit is used up" : (msg||"error "+res.status));
  }
  const j = await res.json();

  const order = j.optimizedWaypoints ? j.optimizedWaypoints.slice().sort((a,b)=>a.optimizedIndex-b.optimizedIndex).map(w=>w.providedIndex) : null;
  return j.routes.map(r=>{ const R=prepTT(r); R.order=order; return R; });
}
function mapMan(x){
  const M=x.maneuver||"", ex=x.roundaboutExitNumber;
  if(M==="DEPART") return {type:"depart"};
  if(M.startsWith("ARRIVE")) return {type:"arrive"};
  if(M.startsWith("WAYPOINT")) return {type:"waypoint"};
  if(M.startsWith("ROUNDABOUT")) return {type:"roundabout", exit:ex, modifier:{ROUNDABOUT_LEFT:"left",ROUNDABOUT_RIGHT:"right",ROUNDABOUT_BACK:"uturn"}[M]||"straight"};
  if(M==="MOTORWAY_EXIT_LEFT") return {type:"off ramp", modifier:"slight left"};
  if(M==="MOTORWAY_EXIT_RIGHT") return {type:"off ramp", modifier:"slight right"};
  if(M==="TAKE_EXIT") return {type:"off ramp", modifier:"straight"};
  if(/^ENTER_|ENTRANCE_RAMP/.test(M)) return {type:"on ramp", modifier:"straight"};
  const mod={KEEP_LEFT:"slight left",KEEP_RIGHT:"slight right",BEAR_LEFT:"slight left",BEAR_RIGHT:"slight right",TURN_LEFT:"left",TURN_RIGHT:"right",
    SHARP_LEFT:"sharp left",SHARP_RIGHT:"sharp right",MAKE_UTURN:"uturn",TRY_MAKE_UTURN:"uturn"}[M];
  if(M.startsWith("KEEP_")) return {type:"fork", modifier:mod};
  if(mod) return {type:"turn", modifier:mod};
  return {type:"continue", modifier:"straight"};
}
function prepTT(r){

  const one=r.legs.length===1;
  const legs=r.legs.map(l=>{ const m=l.summary||(one? r.summary : {}); return {distance:m.lengthInMeters||0, duration:m.travelTimeInSeconds||0, delay:m.trafficDelayInSeconds||0}; });
  const cum=[0]; for(let i=1;i<pts.length;i++) cum[i]=cum[i-1]+hav(pts[i-1],pts[i]);
  const idxAt = off => { let lo=0, hi=cum.length-1; while(lo<hi){ const m=(lo+hi)>>1; if(cum[m]<off-1) lo=m+1; else hi=m; } return lo; };
  const steps=[], stepStart=[], stepT=[];
  (r.guidance?.instructions||[]).forEach(x => {
    let i = x.pointIndex!=null ? x.pointIndex : idxAt(x.routeOffsetInMeters||0);
    i = Math.min(Math.max(i, stepStart.length? stepStart[stepStart.length-1] : 0), pts.length-1);
    if(!steps.length && i>0){ steps.push({maneuver:{type:"depart"},name:"",ref:""}); stepStart.push(0); stepT.push(0); }
    steps.push({maneuver:mapMan(x), name:x.street||"", ref:(x.roadNumbers||[])[0]||"", sign:x.signpostText||""});
    stepStart.push(i); stepT.push(x.travelTimeInSeconds||0);
  });
  if(!steps.length){ steps.push({maneuver:{type:"depart"},name:"",ref:""},{maneuver:{type:"arrive"},name:"",ref:""}); stepStart.push(0,pts.length-1); stepT.push(0,r.summary.travelTimeInSeconds); }
  steps.forEach((s,k)=> s.distance = (k+1<steps.length? cum[stepStart[k+1]] : cum[cum.length-1]) - cum[stepStart[k]]);
  const sec=r.sections||[];
  const traffic = sec.filter(s=>s.sectionType==="TRAFFIC").map(s=>({a:s.startPointIndex,b:s.endPointIndex,mag:s.magnitudeOfDelay??0,delay:s.delayInSeconds||0,cat:s.simpleCategory||"JAM",kmh:s.effectiveSpeedInKmh}));
  const toll = sec.some(s=>s.sectionType==="TOLL"||s.sectionType==="TOLL_ROAD");
  const limits = sec.filter(s=>s.sectionType==="SPEED_LIMIT" && s.maxSpeedLimitInKmh).map(s=>({a:s.startPointIndex, b:s.endPointIndex, kmh:s.maxSpeedLimitInKmh}));
  const lanes = sec.filter(s=>s.sectionType==="LANES" && Array.isArray(s.lanes)).map(s=>({a:s.startPointIndex, b:s.endPointIndex, lanes:s.lanes.map(l=>({d:l.directions||[], f:l.follow||null}))}));
  const sm=r.summary;

    distance:sm.lengthInMeters, duration:sm.travelTimeInSeconds, delay:sm.trafficDelayInSeconds||0,

}
function finish(R){
  const byName={}; R.steps.forEach(s => { const n=s.ref? s.ref+(s.name&&s.name!==s.ref?" "+s.name:"") : s.name; if(n) byName[n]=(byName[n]||0)+(s.distance||0); });
  R.via = Object.entries(byName).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  let ok=R.stepT.length===R.steps.length && R.stepT[R.stepT.length-1]>0;
  for(let i=1;ok&&i<R.stepT.length;i++) if(R.stepT[i]<R.stepT[i-1]) ok=false;

}
async function fetchOSRM(pts,best){
  if(!Array.isArray(pts)) pts=[pts,best], best=false;
  const coords=pts.map(p=>p.lng+","+p.lat).join(";");
  if(best){   // OSRM's trip service finds the quickest order between a fixed start and end
    try{ const j=await (await fetch(OSRM.replace("/route/","/trip/")+coords+"?source=first&destination=last&roundtrip=false&overview=full&geometries=geojson&steps=true")).json();
      if(j.code==="Ok" && j.trips?.length){ const R=prep(j.trips[0]);
        R.order = pts.slice(1,-1).map((_,k)=>k).sort((a,b)=>j.waypoints[a+1].waypoint_index-j.waypoints[b+1].waypoint_index); return [R]; } }catch(e){}
    toast("Couldn't work out the best order, so your order is used.");
  }
  const base = OSRM+coords+"?overview=full&geometries=geojson&steps=true&alternatives="+(pts.length===2);
  let j;
  if(S.avoidTolls){
    try{ j = await (await fetch(base+"&exclude=toll")).json(); }catch(e){ j=null; }
    if(!j || j.code!=="Ok"){ toast("Toll-free routing isn't offered by this routing server. Showing all routes."); j=null; }
  }
  if(!j) j = await (await fetch(base)).json();
  if(j.code!=="Ok" || !j.routes?.length) throw new Error(j.message||"No route found");
  return j.routes.map(prep);
}
function prep(r){
  const steps=[], pts=[], stepStart=[], legEnd=[], last=r.legs.length-1;
  r.legs.forEach((l,li)=>{ l.steps.forEach(s0=>{
      let s=s0, t=s0.maneuver.type;
      if(t==="arrive" && li<last) s={...s0, maneuver:{...s0.maneuver, type:"waypoint"}};        // a stop on the way
      else if(t==="depart" && li>0) s={...s0, maneuver:{...s0.maneuver, type:"continue", modifier:"straight"}};
      steps.push(s); stepStart.push(Math.max(0,pts.length-1));
      s.geometry.coordinates.forEach((xy,j) => { if(pts.length && j===0) return; pts.push({lat:xy[1], lng:xy[0]}); }); });
    legEnd.push(pts.length-1); });
  const legs=r.legs.map(l=>({distance:l.distance, duration:l.duration, delay:0}));
  const cum=[0]; for(let i=1;i<pts.length;i++) cum[i]=cum[i-1]+hav(pts[i-1],pts[i]);
  const toll = steps.some(s => (s.intersections||[]).some(x => (x.classes||[]).includes("toll")));
  const stepT=[]; let t=0; steps.forEach(s=>{ stepT.push(t); t+=s.duration||0; });

}
/* time left from a point on the route, using per-step travel times (these include traffic) */
function timeLeft(R, along, cur){
  const total=R.cum[R.cum.length-1]||1;

  const n=R.steps.length, s0=R.cum[R.stepStart[cur]], s1=cur+1<n? R.cum[R.stepStart[cur+1]] : total;
  const t0=R.stepT[cur], t1=cur+1<n? R.stepT[cur+1] : R.duration;
  const f = s1>s0 ? Math.min(1,Math.max(0,(along-s0)/(s1-s0))) : 1;
  return Math.max(0, R.duration-(t0+(t1-t0)*f));
}
function routeLayers(R, main){

  out.push(L.polyline(R.pts,{color:"#ffffff",weight:11,opacity:.9}), L.polyline(R.pts,{color:getVar("--route"),weight:7}));
  (R.traffic||[]).forEach(s => { if(s.b>s.a) out.push(L.polyline(R.pts.slice(s.a,s.b+1),{color:JAM_COL[s.mag]||JAM_COL[2],weight:7,opacity:1})); });

function trafficTag(r){

function remainingVia(near){
  if(!S.via?.length || !S.R?.legEnd) return S.via||[];
  near = near || nearest(S.R, S.pos||S.R.pts[0], S.lastIdx);
  return S.via.filter((v,k)=> S.R.legEnd[k]==null || near.i < S.R.legEnd[k]-1);
}
function drawNavRoute(){
  routeLines.forEach(l=>l.remove());
  const R=S.R;
  // already-driven part in grey (drawn first, so the road ahead sits on top)
  S.doneLine=L.polyline([R.pts[0]],{color:"#1e3a8a",weight:10,opacity:.95,lineCap:"round"});
  S.casingLine=L.polyline(R.pts,{color:"#ffffff",weight:15,opacity:.95});
  S.aheadLine=L.polyline(R.pts,{color:"#1e9bff",weight:10});
  S.jamLines=(R.traffic||[]).filter(t=>t.b>t.a).map(t=>({t, l:L.polyline(R.pts.slice(t.a,t.b+1),{color:JAM_COL[t.mag]||JAM_COL[2],weight:10,opacity:1})}));
  routeLines=[S.doneLine,S.casingLine,S.aheadLine,...S.jamLines.map(x=>x.l)].map(l=>l.addTo(map));
  if(R.sig) drawSignals(R); else loadSignals(R).then(()=>{ if(S.nav && S.R===R) drawSignals(R); });
}
/* split the route at your position: grey behind you, blue (and traffic colours) ahead */
function paintProgress(near){
  const R=S.R; if(!R || !S.aheadLine) return;
  const a=R.pts[near.i], b=R.pts[near.i+1]||a, here={lat:a.lat+(b.lat-a.lat)*near.t, lng:a.lng+(b.lng-a.lng)*near.t};
  S.doneLine.setLatLngs(R.pts.slice(0,near.i+1).concat([here]));
  const ahead=[here].concat(R.pts.slice(near.i+1));
  S.casingLine.setLatLngs(ahead); S.aheadLine.setLatLngs(ahead);
  (S.jamLines||[]).forEach(({t,l})=>{ if(t.b<=near.i) l.setLatLngs([]); else if(t.a<=near.i) l.setLatLngs([here].concat(R.pts.slice(near.i+1,t.b+1))); });
}

/* time labels on the map for each route, like "25 min · Best" */
let bubbleLayer=null;
function drawRouteBubbles(){
  if(!bubbleLayer) bubbleLayer=L.layerGroup().addTo(map);
  bubbleLayer.clearLayers();
  if(!S.dest || S.nav || S.tmode==="transit" || !S.routes.length) return;
  const fastest=Math.min(...S.routes.map(r=>r.duration)), ms=BASE()==="ms";
  S.routes.forEach((r,i)=>{
    // put each label where that route is furthest from the chosen one, so labels don't sit on top of each other
    let k=Math.floor(r.pts.length*0.45);
    if(i!==S.sel){ const sel=S.routes[S.sel]; let best=-1;
      for(let j=Math.floor(r.pts.length*.15); j<r.pts.length*.85; j+=Math.max(1,Math.floor(r.pts.length/60))){ const n=nearest(sel, r.pts[j], 0); if(n.d>best){ best=n.d; k=j; } } }
    const lbl = fmtDur(r.duration)+(i===S.sel && r.duration===fastest? '<small>'+(ms?"Terbaik":"Best")+'</small>' : '');
    const m=L.marker(r.pts[k],{zIndexOffset: i===S.sel?900:800, icon:L.divIcon({className:"", iconSize:[0,0], html:'<div class="rbub'+(i===S.sel?" sel":"")+'">'+lbl+'</div>'})}).addTo(bubbleLayer);
    m.on("click",()=>{ S.sel=i; drawRoutes(); renderRouteSheet(); });
  });
}

function openSheet(html, onClose, opts){ const s=$("sheet"); syncTabH();

  if(!S.sheetPushed){ try{ if(!(history.state && history.state.sheet)) history.pushState({sheet:1},""); S.sheetPushed=true; }catch(e){} }

/* drag the handle down to close */
function wireSwipe(el){
  let y0=null, dy=0; const sh=$("sheet");
  el.addEventListener("touchstart", e=>{ y0=e.touches[0].clientY; dy=0; sh.style.transition="none"; }, {passive:true});
  el.addEventListener("touchmove", e=>{ if(y0==null) return; dy=Math.max(0,e.touches[0].clientY-y0); sh.style.transform="translateY("+dy+"px)"; }, {passive:true});
  el.addEventListener("touchend", ()=>{ sh.style.transition=""; sh.style.transform=""; if(dy>70){ if(S.sheetMiniOK && !sh.classList.contains("mini")) setSheetMini(true); else dismissSheet(); } y0=null; });
}

/* phone back gesture closes the open sheet instead of leaving the app */

Object.entries(PACK_X).forEach(([k,x])=>Object.assign(PACKS[k],x));
const P = () => PACKS[S.lang] || PACKS.en;
const BASE = () => P().base;
const pick = a => a[Math.floor(Math.random()*a.length)];
/* join two spoken sentences without doubling punctuation */
function joinS(a,b){ if(!b) return a; const zh=P().sep==="。"; return /[.!?。！？]$/.test(a)? a+(zh?"":" ")+b : a+(zh?"。":". ")+b; }
const funOn = () => S.fun && P().fun;
function hzLabel(k){ return HZ[k][BASE()]; }
function hzSay(k){ return (P().hz && P().hz[k]) || HZ[k][BASE()]; }

function instr(step){
  const t=P(), m=step.maneuver, mod=m.modifier||"straight";
  const road = step.ref && step.name && step.name!==step.ref ? step.ref+" "+step.name : (step.ref||step.name||"");
  let s, withRoad=true;
  switch(m.type){
    case "depart": s=t.depart; break;
    case "arrive": s=t.arrive; withRoad=false; break;
    case "waypoint": s=t.stop; withRoad=false; break;
    case "roundabout": case "rotary": s=m.exit? t.rb(m.exit) : t.mod[mod]; break;
    case "exit roundabout": case "exit rotary": s=t.rbx; break;
    case "off ramp": s=mod.includes("left")? t.exitL : mod.includes("right")? t.exitR : t.exit; break;
    case "on ramp": s=t.ramp; break;
    case "merge": s=t.merge; break;
    case "fork": s=t.keep[mod]||t.keep.straight; break;
    case "new name": case "continue": s=mod==="straight"? t.mod.straight : t.mod[mod]; break;
    default: s=t.mod[mod]||t.mod.straight;
  }
  const full = withRoad&&road ? (t.ontoFn? t.ontoFn(s,road) : s+t.onto+road) : s;
  return {text:s, road: withRoad? road : "", full};
}
function spokenDist(m){ const t=P();
  if(m>=950){ const k=Math.round(m/100)/10; return k+(k===1&&t.ukm1? t.ukm1 : t.ukm); }
  return Math.max(100,Math.round(m/100)*100)+t.um; }


/* ================= speech ================= */
function findVoice(pack){
  if(!("speechSynthesis" in window)) return {v:null, ok:false};
  const vs=speechSynthesis.getVoices(), norm=x=>x.lang.toLowerCase().replace("_","-");
  const find = list => { for(const w of list||[]){ const v=vs.find(x=>norm(x)===w)||vs.find(x=>norm(x).startsWith(w)); if(v) return v; } return null; };
  const v=find(pack.langs); if(v) return {v, ok:true};
  return {v:find(pack.fallback), ok:false};
}
function say(text){
  if(!S.voice || !("speechSynthesis" in window) || !text) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);
    const {v}=findVoice(P());
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=P().langs[0];
    u.rate=1.02; speechSynthesis.speak(u); }catch(e){}
}
/* say a normal line, or (in lawak mode) a random funny one from the pack */
function sayFun(key, plain){ const f=funOn(); say(f && f[key] ? pick(f[key]) : plain); }

/* look over the whole route first; "Let's go" starts the drive (or it starts by itself after a short countdown, or once you move off) */
function startNav(sim){
  if(!S.routes.length) return;
  clearRvPin(); S.rv=null; S.reviewing={sim}; beginDrive(); return;
  const R=S.routes[S.sel], ms=BASE()==="ms";
  if(bubbleLayer) bubbleLayer.clearLayers(); showAvoidChip(false);
  routeLines.forEach(l=>l.remove()); routeLines=[]; routeLayers(R,true).forEach(l=>{ l.addTo(map); routeLines.push(l); });
  S.reviewing={sim, left:10, paused:false};
  const turns=[]; for(let j=0;j<R.steps.length && turns.length<3;j++){ const k=nextTurn(R,j); if(k!==j) j=k; const st=R.steps[k]; if(!st || st.maneuver.type==="depart") continue;
    if(turns.length && turns[turns.length-1].k===k) continue; turns.push({k, ins:instr(st), at:R.cum[R.stepStart[k]]}); if(st.maneuver.type==="arrive") break; }
  const u=tripUse(R.distance,R.duration);
  let h='<div class="dest"><h2>'+(ms?"Semak laluan anda":"Review your route")+'</h2><p>'+esc(S.dest.name)+'</p></div>'+
    '<div class="rsum"><span class="rtime">'+fmtDur(R.duration)+'</span><span class="rdist">'+fmtDist(R.distance)+' · '+(ms?"tiba ":"arrive ")+clock(new Date(Date.now()+R.duration*1000))+'</span></div>'+
    '<div class="rvia">'+(ms?"Melalui ":"Via ")+esc(R.via.join(", ")||(ms?"jalan tempatan":"local roads"))+'</div>'+
    '<div class="rchips"><span class="rchip">'+(u.ev?"🔌":"⛽")+' RM'+u.cost.toFixed(2)+'</span>'+(R.toll?'<span class="rchip tol">Tol</span>':'')+((R.alerts||[]).length?'<span class="rchip haz"><i></i>'+R.alerts.length+(ms?" amaran":" hazard"+(R.alerts.length>1?"s":""))+'</span>':'')+(S.modes.length?'<span class="rchip">'+guideSummary(R.guide,R)+'</span>':'')+'</div>'+
    '<div class="lhead">'+(ms?"Belokan pertama":"First turns")+'</div><ol class="turnlist">'+turns.map(t=>'<li><span class="tarr">'+arrowSVG(R.steps[t.k])+'</span><div><b>'+esc(t.ins.text)+'</b><span>'+esc([t.ins.road, t.at>0? fmtDist(t.at) : ""].filter(Boolean).join(" · "))+'</span></div></li>').join("")+'</ol>'+
    '<button class="bigGo wide letsgo" id="letsGo"><span class="gi" aria-hidden="true">▶</span><span class="gt"><b>'+(ms?"JOM GERAK":"LET'S GO")+'</b><small id="lgCount">'+(ms?"mula dalam ":"starts in ")+'10 s</small></span></button>'+
    '<div class="row"><button class="btn small" id="lgWait">'+(ms?"⏸ Tunggu":"⏸ Wait, I'm reviewing")+'</button><button class="btn small" id="lgBack">'+(ms?"Kembali":"Back")+'</button></div>';
  openSheet(h, cancelReview);
  requestAnimationFrame(()=> map.fitBounds(L.latLngBounds(R.pts), {paddingTopLeft:[30,60], paddingBottomRight:[30, sheetH()+30], maxZoom:17}));
  $("letsGo").onclick=()=>beginDrive();
  $("lgWait").onclick=()=>{ const v=S.reviewing; if(!v) return; v.paused=!v.paused; $("lgWait").textContent = v.paused? (ms?"▶ Sambung kiraan":"▶ Resume countdown") : (ms?"⏸ Tunggu":"⏸ Wait, I'm reviewing"); $("lgCount").textContent = v.paused? (ms?"tekan bila sedia":"tap when you're ready") : (ms?"mula dalam ":"starts in ")+v.left+" s"; };
  $("lgBack").onclick=cancelReview;
  if(P().base==="en" && (S.lang==="en"||S.lang==="hokkien")) say("Here's your route. "+spokenDur(R.duration)+", "+gDist(R.distance)+". Tap Let's go when you're ready.");
  else if(S.lang==="ms") say("Ini laluan anda. "+spokenDur(R.duration)+", "+gDist(R.distance)+". Tekan Jom Gerak bila sedia.");
  clearInterval(S.reviewT);
  S.reviewT=setInterval(()=>{ const v=S.reviewing; if(!v){ clearInterval(S.reviewT); return; }
    if(!v.sim && (S.speed||0)>4){ beginDrive(); return; }            // you've already started driving
    if(v.paused) return; v.left--; if($("lgCount")) $("lgCount").textContent=(ms?"mula dalam ":"starts in ")+v.left+" s";
    if(v.left<=0) beginDrive(); }, 1000);
}
function cancelReview(){ clearInterval(S.reviewT); S.reviewing=null; try{ speechSynthesis.cancel(); }catch(e){} if(S.routes.length){ drawRoutes(); renderRouteSheet(); } else closeSheet(); }
function beginDrive(){
  const v=S.reviewing; if(!v) return; clearInterval(S.reviewT); S.reviewing=null;
  goNav(v.sim);
  const f=funOn(); say(joinS(LETSGO[S.lang]||LETSGO[P().base]||"Let's go!", f&&f.start? pick(f.start) : ""));
}
async function goNav(sim){
  if(S.safe) endSafe(); document.body.classList.add("driving");
  if(bubbleLayer) bubbleLayer.clearLayers(); showAvoidChip(false);
  S.R = S.routes[S.sel]; S.nav=true; S.lastIdx=0; S.spoken={}; S.alerted={}; S.follow=true;
  closeSheet(); $("top").hidden=true; $("navsign").hidden=false; $("tripbar").hidden=false;
  $("locBtn").classList.add("on"); if(accCircle){ accCircle.remove(); accCircle=null; }
  setRest();
  S.jamSaid={}; S.alertSaid={}; drawNavRoute(); drawAlerts(S.R); if(!S.R.alerts) withAlerts(S.R); S.navAlertsAt=Date.now();
  clearInterval(S.refreshT); S.refreshT=setInterval(refreshTraffic, TRAFFIC_REFRESH_MS);
  try{ S.wake = await navigator.wakeLock?.request("screen"); }catch(e){}
  S.navT0=Date.now(); S.drove=0; S.lastFun=Date.now(); S.prevNav=null;
  if(sim) startSim(); else if(S.pos) onPos(S.pos);
  if(sim){ S.smInit=false; S.heading=bearing(S.R.pts[0],S.R.pts[1]||S.R.pts[0]); }
  else if((S.speed||0)<=1.5){ const rh=routeHeading(S.pos||S.R.pts[0]) ?? bearing(S.R.pts[0], jvAt(S.R,30)); S.heading=S.smHeading=rh; S.smInit=true; paintArrow(); }
  followTo(sim? S.R.pts[0] : (S.pos||S.R.pts[0]));
  guideStart();
}
function endNav(){
  guideEnd(); document.body.classList.remove("driving"); if($("laneBar")) $("laneBar").hidden=true; showLimit(null); clearRoadLabel(); clearSignals(); S.camSaid={}; S.nav=false; S.freeFollow=false; if($("jview")) $("jview").hidden=true; JV.key=null; if(S.briefing) stopBriefing(); setTimeout(applyTilt); $("locBtn").classList.remove("on"); resetNorth(); stopSim(); clearInterval(S.refreshT); S.refreshT=null; try{ S.wake?.release(); }catch(e){}
  $("navsign").hidden=true; $("tripbar").hidden=true; $("top").hidden=false;
  routeLines.forEach(l=>l.remove()); routeLines=[]; if(destMarker) destMarker.remove(); S.dest=null; S.routes=[]; S.via=[]; drawStops(); drawAlerts(null);
  setRest();
  if("speechSynthesis" in window) speechSynthesis.cancel();
}
$("endBtn").onclick = () => S.tnav ? endTransitNav() : endNav();

function nearest(R,p,from){
  const n=R.pts.length; let best={d:1e12,i:0,t:0};
  const scan=(a,b)=>{ for(let i=a;i<=b;i++){ const r=segProj(p,R.pts[i],R.pts[i+1]); if(r.d<best.d) best={d:r.d,i,t:r.t}; } };
  scan(Math.max(0,from-3), Math.min(n-2, from+400)); if(best.d>80) scan(0,n-2);
  best.along = R.cum[best.i] + best.t*(R.cum[best.i+1]-R.cum[best.i]);
  return best;
}
/* skip "continue straight" / road-name-change steps: the sign and voice always show the next real turn */
function nextTurn(R, k){
  const n=R.steps.length;
  for(let j=Math.max(0,k); j<n; j++){ const m=R.steps[j].maneuver;
    if(!((m.type==="continue"||m.type==="new name"||m.type==="depart") && (!m.modifier||m.modifier==="straight"))) return j; }
  return n-1;
}
function stepAt(R,i){ let s=0; while(s+1<R.stepStart.length && R.stepStart[s+1]<=i) s++; return s; }

function navTick(p){
  const R=S.R, t=P(), near=nearest(R,p,S.lastIdx);
  if(S.prevNav) S.drove += Math.min(hav(S.prevNav,p), 500); S.prevNav=p;
  // off-route → reroute
  if(near.d>60 && !S.rerouting && Date.now()-S.lastReroute>10000 && !S.sim){ reroute(p); }
  S.lastIdx=near.i;
  const cur=stepAt(R,near.i), nxt=nextTurn(R, cur+1), step=R.steps[nxt];
  const toMan=Math.max(0, R.cum[R.stepStart[nxt]]-near.along), remain=Math.max(0, R.cum[R.cum.length-1]-near.along);
  const ins=instr(step);
  $("navArrow").innerHTML=arrowSVG(step);
  $("navDist").textContent=fmtDist(toMan);
  $("navIns").textContent=ins.text;
  $("navRoad").textContent=shortRoad(step.name, step.ref);
  try{ jvUpdate(R, nxt, toMan, step); }catch(e){}
  try{ updateRoadLabel(R, nxt, toMan); }catch(e){}
  const nx2=nextTurn(R, nxt+1), after=nx2!==nxt? R.steps[nx2] : null;
  const gap = after ? R.cum[R.stepStart[nx2]]-R.cum[R.stepStart[nxt]] : 1e9;
  if(after && gap<400 && after.maneuver.type!=="arrive"){
    $("navNext").hidden=false; $("navNext").textContent=t.then+instr(after).text;
  } else $("navNext").hidden=true;
  // trip bar (per-step times include live traffic when TomTom is on)
  const leftSec = timeLeft(R, near.along, cur);
  // traffic sections still ahead; a jam we're already in only counts for the part left
  const jamAhead = (R.traffic||[]).map(s => {
    const a=R.cum[s.a], b=R.cum[s.b];
    if(b-near.along < 50) return null;
    return near.along<=a ? s : {...s, delay:s.delay*(b-near.along)/Math.max(1,b-a)};
  }).filter(Boolean);
  const jamMin = Math.round(jamAhead.reduce((a,s)=>a+s.delay,0)/60);
  S.lastRemain=remain; S.lastLeft=leftSec; paintProgress(near);
  $("etaClock").textContent=clock(new Date(Date.now()+leftSec*1000));
  $("etaSub").textContent=fmtDur(leftSec)+" · "+fmtDist(remain)+(R.live? (jamMin>=1? " · +"+jamMin+" min jam" : "") : "");
  $("spd").textContent=Math.round((S.speed||0)*3.6);
  // trip cost = fuel used so far + estimate for what's left
  const used=tripUse(S.drove, Math.max(1,(Date.now()-S.navT0)/1000)), left=tripUse(remain, leftSec);
  const tot=(S.drove>50?used.cost:0)+left.cost, totS=used.sub!=null ? (S.drove>50?used.sub:0)+left.sub : null;
  $("etaFuel").textContent=(used.ev?"🔌 ":"⛽ ")+"RM"+tot.toFixed(2)+(totS!=null? " · BUDI RM"+totS.toFixed(2) : "");
  // voice prompts
  // voice: an early warning, then "turn now" about 6 seconds before the turn, at any speed
  const ms=Math.max(S.speed||0, 3), kmh=ms*3.6;
  const far = kmh>80 ? 1200 : kmh>50 ? 600 : 300, nearD = Math.min(220, Math.max(45, ms*6));
  if(S.quiet){ S.quiet=false; if(toMan<=far) S.spoken[nxt+"f"]=1; if(toMan<=nearD) S.spoken[nxt+"n"]=1; }
  if(step.maneuver.type!=="arrive"){
    if(toMan<=far && toMan>nearD+40 && !S.spoken[nxt+"f"]){ S.spoken[nxt+"f"]=1; say(t.inX(spokenDist(toMan))+ins.full); }
    else if(toMan<=nearD && !S.spoken[nxt+"n"]){ S.spoken[nxt+"n"]=1; S.spoken[nxt+"f"]=1;
      const thenTxt = after && gap<150 && after.maneuver.type!=="arrive" ? (t.sep==="。"?"，":", ")+t.then.replace(/[:：]\s*$/,"")+" "+instr(after).text : "";
      say(ins.full+thenTxt+(funOn()? pick(funOn().turn) : "")); }
  }
  if(remain<30){ arrived(); return; }
  try{ guideTick(near, toMan, remain, leftSec); }catch(e){}
  // lawak mode: a short line now and then on long, quiet stretches (never near a turn)
  if(funOn() && !S.sim && toMan>3000 && Date.now()-S.lastFun > 12*60000 && Date.now()-S.navT0 > 10*60000){ S.lastFun=Date.now(); say(pick(funOn().bored)); }
  if(!sigCheck(near) && !hazardCheck(p) && !alertCheck(near)) jamCheck(near, jamAhead);
  try{ laneCheck(R, near); showLimit(limitAt(R, near.i)); }catch(e){}
  if(Date.now() < (S.alertMutedUntil||0)) $("alert").hidden=true;     // you closed the banner: keep it quiet for a minute
  $("alertX").hidden = $("alert").hidden;
}
/* warn about slow traffic on the route within 2 km */
function jamCheck(near, ahead){
  const R=S.R, a=$("alert"), t=P();
  const next = ahead.find(s=>s.mag>=2 || s.delay>=120);
  if(!next){ a.hidden=true; return; }
  const dist = Math.max(0, R.cum[next.a]-near.along), inside = next.a<=near.i;
  if(dist>2000){ a.hidden=true; return; }
  const kind = next.cat==="ROAD_CLOSURE" ? t.jam.closed : next.cat==="ROAD_WORK" ? t.jam.works : next.mag>=3 ? t.jam.heavy : t.jam.slow;
  const mins=Math.max(1,Math.round(next.delay/60)), len=fmtDist(Math.max(0,R.cum[next.b]-Math.max(near.along,R.cum[next.a])));
  a.hidden=false; a.style.background=JAM_COL[next.mag]||JAM_COL[2]; a.style.color=next.mag>=2?"#fff":"#2a1d00";
  a.innerHTML='<span style="font-size:22px">🚗</span><span>'+esc(kind)+' · '+(inside? "↦ "+len : fmtDist(dist))+' · +'+mins+' min</span>';
  const key=next.a+":"+next.b;
  if(!S.jamSaid[key] && !inside){ S.jamSaid[key]=1; say(joinS(t.jamSay(kind,mins), funOn()? pick(funOn().jam) : "")); }
}
/* every 2 min: ask for the fastest route from here with current traffic */
async function refreshTraffic(){
  if(!S.nav || S.sim || !S.ttKey || !S.pos || S.rerouting || document.hidden) return;
  const R=S.R, near=nearest(R,S.pos,S.lastIdx), oldLeft=timeLeft(R, near.along, stepAt(R,near.i));
  S.via=remainingVia(near); let nr; try{ nr=(await fetchTomTom([S.pos,...S.via,S.dest],0))[0]; }catch(e){ return; }
  if(!S.nav) return;
  const save = oldLeft - nr.duration;
  carryAlerts(R, nr); S.R=nr; S.lastIdx=0; S.quiet=true; S.jamSaid={}; drawNavRoute(); drawAlerts(S.R);
  if(save>=FASTER_MIN_SAVE){ const m=Math.round(save/60);
    say(P().faster(m)); toast((BASE()==="ms"? "Laluan lebih cepat · jimat " : "Switched to a faster route · saves ")+m+" min"); }
  navTick(S.pos);
}
async function reroute(p, keepVia){
  S.rerouting=true; S.lastReroute=Date.now(); sayFun("reroute", P().reroute); toast(P().reroute);
  if(!keepVia) S.via=remainingVia(); drawStops();
  try{ const rs=await fetchRoutes(p,S.dest,0); carryAlerts(S.R, rs[0]); S.R=rs[0]; S.lastIdx=0; S.spoken={}; S.jamSaid={}; drawNavRoute(); drawAlerts(S.R);
  }catch(e){ toast("Couldn't recalculate. Keep driving; retrying shortly."); }
  S.rerouting=false;
}

/* ================= simulation (test drive along the route) ================= */
function startSim(){
  stopSim(); let d=0; const R=S.R, total=R.cum[R.cum.length-1], v=22; // 22 m/s ≈ 80 km/h
  S.sim=setInterval(()=>{
    d+=v*0.5; if(d>=total) d=total;
    let i=0; while(i<R.cum.length-2 && R.cum[i+1]<d) i++;
    const seg=R.cum[i+1]-R.cum[i]||1, f=(d-R.cum[i])/seg, a=R.pts[i], b=R.pts[i+1];
    const p={lat:a.lat+(b.lat-a.lat)*f, lng:a.lng+(b.lng-a.lng)*f};
    S.heading=bearing(a,b); onPos(p, S.heading, v);
    if(d>=total) stopSim();
  },500);
}
function stopSim(){ if(S.sim){ clearInterval(S.sim); S.sim=null; } }

/* ================= hazard reports ================= */
function loadReports(){
  const now=Date.now();
  S.reports = store.get("reports",[]).filter(r => HZ[r.type] && now-r.t < HZ[r.type].ttl*60000);
  store.set("reports",S.reports); drawReports();
}
function drawReports(){
  hzLayer.clearLayers();
  S.reports.forEach(r => {
    const h=HZ[r.type], mins=Math.round((Date.now()-r.t)/60000);
    const m=L.marker(r,{icon:L.divIcon({className:"",html:'<div class="hzpin">'+h.e+'</div>',iconSize:[38,38],iconAnchor:[19,19]})}).addTo(hzLayer);
    m.bindPopup('<div class="pop"><b>'+h[BASE()]+'</b><div style="color:var(--muted);font-size:13px">Reported '+(mins<1?"just now":mins+" min ago")+'</div><div class="row"><button class="btn small" data-gone="'+r.id+'">🗑 Remove report</button></div></div>');
  });
}
/* list of reports you added, each removable */
function myReportsHTML(){
  if(!S.reports.length) return '<p class="hint">Your reports appear here, where you can remove them. They also disappear by themselves after a while.</p>';
  let h='<h3 class="sec">Your reports</h3><ul class="myrep">';
  S.reports.slice().reverse().forEach(r=>{ const m=Math.round((Date.now()-r.t)/60000);
    h+='<li><i>'+HZ[r.type].e+'</i><div><b>'+esc(hzLabel(r.type))+'</b><span>'+(m<1?"just now":m<60?m+" min ago":Math.round(m/60)+" h ago")+'</span></div><button class="rmrep" data-rm="'+r.id+'" aria-label="Remove report">✕</button></li>'; });
  return h+'</ul><button class="btn small" id="rmAll">Remove all my reports</button>';
}
function wireMyReports(rerender){
  document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>{ removeReport(b.dataset.rm); rerender(); });
  if($("rmAll")) $("rmAll").onclick=()=>{ S.reports=[]; store.set("reports",S.reports); drawReports(); toast("All your reports removed"); rerender(); };
}
function removeReport(id){ S.reports=S.reports.filter(r=>r.id!==id); store.set("reports",S.reports); drawReports(); toast("Report removed"); }
function applyReportBtn(){ $("reportBtn").hidden=!S.showReportBtn; }
map.on("popupopen", e => { const b=e.popup.getElement().querySelector("[data-gone]"); if(b) b.onclick=()=>{ S.reports=S.reports.filter(r=>r.id!==b.dataset.gone); store.set("reports",S.reports); map.closePopup(); drawReports(); toast("Report removed"); }; });
function openReport(){
  let h='<div class="dest"><h2>'+(BASE()==="ms"?"Lapor":"Report")+'</h2><p>'+(S.pos?"At your current location":"No GPS fix — report goes at the map centre")+'</p></div><div class="hzgrid">';
  Object.entries(HZ).forEach(([k,v]) => h+='<button class="hz" data-k="'+k+'"><i>'+v.e+'</i>'+v[BASE()]+'</button>');
  h+='</div>'+myReportsHTML()+'<div class="row"><button class="btn" id="cancelRep">Close</button></div>';
  openSheet(h, afterSheet); wireMyReports(openReport);
  document.querySelectorAll(".hz").forEach(b => b.onclick=()=>{
    const p=S.pos||map.getCenter();
    S.reports.push({id:Date.now().toString(36), type:b.dataset.k, lat:p.lat, lng:p.lng, t:Date.now()});
    store.set("reports",S.reports); drawReports(); afterSheet(); toast(hzLabel(b.dataset.k)+" reported. Terima kasih!");
  });
  $("cancelRep").onclick=afterSheet;
}
function afterSheet(){ if(S.nav){ closeSheet(); setRest(); } else if(S.routes.length) renderRouteSheet(); else closeSheet(); }
function hazardCheck(p){
  let shown=null;
  S.reports.forEach(r => { const d=hav(p,r);
    if(d<700){ const ahead = Math.abs(((bearing(p,r)-S.heading+540)%360)-180) < 60;
      if(ahead && d>20){ shown={r,d}; if(!S.alerted[r.id]){ S.alerted[r.id]=1; say(P().hazard(hzSay(r.type))); } } } });
  const a=$("alert");
  if(shown){ a.hidden=false; a.style.background=""; a.style.color=""; a.innerHTML='<span style="font-size:24px">'+HZ[shown.r.type].e+'</span><span>'+esc(hzLabel(shown.r.type))+' · '+fmtDist(shown.d)+'</span>'; }
  else a.hidden=true;
  return !!shown;
}

/* ================= petrol / EV cost ================= */
/* m = actual pump (market) price, s = subsidised price for eligible Malaysians (null = no subsidy) */
const FUELS={
  ron95:{n:"RON95", m:4.32, s:1.99, sn:"BUDI95", u:"L"},
  ron97:{n:"RON97", m:4.80, s:null, u:"L"},
  diesel:{n:"Diesel, Peninsular", m:5.07, s:2.10, sn:"BUDI Diesel", u:"L"},
  dieseleast:{n:"Diesel, Sabah/Sarawak/Labuan", m:2.15, s:null, u:"L"},
  evhome:{n:"Electric, home charging", m:0.45, s:null, u:"kWh"},
  evdc:{n:"Electric, public DC charger", m:1.20, s:null, u:"kWh"} };
const FUEL_ASOF="22–28 Oct 2026";
/* [name, typical real-world use per 100 km, fuel, kind] grouped by brand */
const CAR_GROUPS={
  "Perodua":{axia:["Perodua Axia",5.0,"ron95"], bezza:["Perodua Bezza",5.2,"ron95"], myvi:["Perodua Myvi 1.5",5.6,"ron95"], ativa:["Perodua Ativa",5.8,"ron95"], alza:["Perodua Alza",6.3,"ron95"]},
  "Proton":{saga:["Proton Saga",6.1,"ron95"], persona:["Proton Persona",6.1,"ron95"], x50:["Proton X50",6.8,"ron95"], x70:["Proton X70",8.0,"ron95"]},
  "Honda":{city:["Honda City",5.6,"ron95"], civic:["Honda Civic 1.5T",6.5,"ron95"], civichev:["Honda Civic e:HEV (hybrid)",4.8,"ron95","hyb"], hrv:["Honda HR-V",6.2,"ron95"]},
  "Toyota":{vios:["Toyota Vios",5.9,"ron95"], ccross:["Toyota Corolla Cross Hybrid",4.8,"ron95","hyb"], hilux:["Toyota Hilux 2.4 (diesel)",8.2,"diesel"]},
  "Tesla (electric)":{tesla3:["Tesla Model 3",14.0,"evhome"], teslay:["Tesla Model Y",15.5,"evhome"]},
  "Other electric":{atto3:["BYD Atto 3",15.6,"evhome"], dolphin:["BYD Dolphin",13.5,"evhome"], emas7:["Proton e.MAS 7",15.0,"evhome"]},
  "Others":{triton:["Mitsubishi Triton (diesel)",8.3,"diesel"], custom:["Other / my own figure",7.0,"ron95"]} };
const CARS=Object.assign({}, ...Object.values(CAR_GROUPS));
/* Use rises in stop-go traffic and at speed. Average speed understates cruising speed on long trips
   (an 90 km/h average usually means ~110 km/h on the highway), so the high-speed steps start early. */
function tripUse(meters, seconds){
  const F=S.fuel, ev=FUELS[F.type].u==="kWh", km=meters/1000, kmh=seconds>0? km/(seconds/3600) : 60;
  const hyb = (CARS[F.car]||[])[3]==="hyb";
  const f = ev  ? (kmh<35?0.95 : kmh<75?1.0 : kmh<90?1.1 : kmh<=105?1.2 : 1.3)
          : hyb ? (kmh<35?1.0  : kmh<75?1.0 : kmh<90?1.08: kmh<=105?1.15: 1.25)
                : (kmh<20?1.4 : kmh<35?1.22 : kmh<55?1.1 : kmh<75?1.0 : kmh<90?1.05 : kmh<=105?1.12 : 1.2);
  const q=km*F.eff/100*f;
  return {q, cost:q*F.price, sub: F.sub!=null ? q*F.sub : null, unit:FUELS[F.type].u, ev};
}
function useText(u){
  return (u.ev?"🔌 ":"⛽ ")+"≈ "+u.q.toFixed(1)+" "+u.unit+" · RM"+u.cost.toFixed(2)+(u.sub!=null? " · subsidised RM"+u.sub.toFixed(2) : "");
}
function arrived(){
  const t=P(), f=funOn(); let msg=t.arrive, spoken=f? pick(f.arrive) : t.arrive;
  if(S.drove>200){ const u=tripUse(S.drove,(Date.now()-S.navT0)/1000);
    msg += " · "+useText(u); if(f) spoken = joinS(spoken, t.cost(u.cost.toFixed(2))); }
  const dest=S.dest; S.lastGuide=S.g && S.g.guide;
  say(spoken); toast(msg); endNav(); showArrival(dest);
}

/* place search: TomTom first (knows Malaysian taman roads, addresses and shops), OpenStreetMap as backup */
function normQuery(v){ return v.trim().replace(/\bjln\.?\s/ig,"Jalan ").replace(/\btmn\.?\s/ig,"Taman ").replace(/\bkg\.?\s/ig,"Kampung ").replace(/\s+/g," "); }
async function searchTomTom(q, signal){
  const c=S.pos||map.getCenter();
  const url=TT+"/search/2/search/"+encodeURIComponent(q)+".json?key="+encodeURIComponent(S.ttKey)+"&countrySet=MY&lat="+c.lat.toFixed(5)+"&lon="+c.lng.toFixed(5)+"&limit=7&typeahead=true&language=en-GB";
  const res=await fetch(url,{signal}); if(!res.ok) throw new Error("tomtom "+res.status);
  const j=await res.json();
  return (j.results||[]).map(r=>{ const a=r.address||{};
    const name = r.poi?.name || (r.type==="Street"||r.type==="Cross Street" ? a.streetName : null) || a.streetName || a.freeformAddress || "Place";
    const sub = r.poi ? [a.freeformAddress, a.countrySubdivision] : [a.municipalitySubdivision, a.municipality, a.countrySubdivision];
    const parts=[]; sub.filter(Boolean).forEach(x=>{ if(!parts.some(y=>y.includes(x))) parts.push(x); });

async function searchPhoton(q, signal){
  const c=S.pos||map.getCenter();
  const url=PHOTON+"?q="+encodeURIComponent(q)+"&limit=6&lat="+c.lat+"&lon="+c.lng+"&bbox="+MY_BBOX.join(",");
  const j=await (await fetch(url,{signal})).json();
  return (j.features||[]).map(f => { const p=f.properties;
    const sub=[p.street&&(p.housenumber?p.housenumber+" ":"")+p.street, p.district||p.locality, p.city, p.state].filter(Boolean);
    return {name:p.name||p.street||"Unnamed place", sub:[...new Set(sub)].join(", "), lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]}; });

async function searchPlaces(v, signal){
  const ll = v.match(/^\s*(-?\d+(\.\d+)?)\s*,\s*(-?\d+(\.\d+)?)\s*$/);
  if(ll) return [{name:"Coordinates", sub:v, lat:+ll[1], lng:+ll[3]}];
  const q=normQuery(v);
  let out=[];
  if(S.ttKey){ try{ out=await searchTomTom(q, signal); }catch(e){ if(e.name==="AbortError") throw e; } }
  if(out.length<3){
    // OpenStreetMap often only knows the full road name, so also try it with "Jalan" in front
    const tries=[q]; if(!/^(jalan|lorong|persiaran|lebuh|lebuhraya)\b/i.test(q) && /\d/.test(q)) tries.push("Jalan "+q);
    for(const t of tries){ try{ out=out.concat(await searchPhoton(t, signal)); }catch(e){ if(e.name==="AbortError") throw e; } }
  }
  const seen=new Set();      // drop near-duplicates of the same place
  return out.filter(r=>{ const k=r.name.toLowerCase()+"|"+r.lat.toFixed(3)+","+r.lng.toFixed(3); if(seen.has(k)) return false; seen.add(k); return true; }).slice(0,8);
}

async function calcPlan(){
  const P1=S.plan, stops=P1.stops.filter(Boolean);
  if(!stops.length){ $("pOut").innerHTML='<p class="hint">Add at least one place first.</p>'; return; }
  const start = S.pos ? {...S.pos, name:"My location"} : {...map.getCenter(), name:"Map centre"};
  const all = P1.round ? [...stops, start] : stops;
  const dest = all[all.length-1], via = all.slice(0,-1);
  $("pOut").innerHTML='<p class="hint">Working out your trip…</p>';
  try{
    const rs = await fetchRoutes(start, dest, 0, {via, best:P1.best});
    const R = rs[0];
    if(R.order && R.order.length===via.length){      // put the stops in the order the route visits them
      const nv = R.order.map(k=>via[k]); via.splice(0, via.length, ...nv);
      P1.stops = P1.round ? [...nv] : [...nv, dest]; savePlan(); }
    S.via=via; S.dest=dest; S.routes=[R]; S.sel=0; P1.res={start, names:[start.name, ...via.map(v=>v.name), dest.name]};
    if(destMarker) destMarker.remove();
    destMarker = L.marker(dest,{icon:L.divIcon({className:"",html:'<div class="destpin"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map);
    resetNorth(); drawRoutes(); drawStops(); renderPlanner();
    withAlerts(R, ()=>{ if(S.sheetClose===closePlanner && S.routes[0]===R){ const sc=$("sheet").scrollTop; renderPlanner(); $("sheet").scrollTop=sc; } });
    map.fitBounds(L.latLngBounds(R.pts), {paddingTopLeft:[30,60], paddingBottomRight:[30, Math.min(sheetH(), innerHeight*0.55)+30]});
  }catch(e){ $("pOut").innerHTML='<p class="hint">Couldn\'t plan this trip: '+esc(e.message)+'</p>'; }
}

const INC = { 0:["⚠️","Incident","Insiden"], 1:["💥","Accident","Kemalangan"], 2:["🌫️","Fog","Kabus"], 3:["⚠️","Dangerous conditions","Keadaan bahaya"],
  4:["🌧️","Heavy rain","Hujan lebat"], 7:["🚧","Lane closed","Lorong ditutup"], 8:["⛔","Road closed","Jalan ditutup"], 9:["🚧","Roadworks","Kerja jalan"],
  10:["💨","Strong wind","Angin kencang"], 11:["🌊","Flooding","Banjir"], 14:["🚗","Broken-down vehicle","Kenderaan rosak"] };
const INC_HZ = {1:"accident", 7:"works", 9:"works", 11:"flood", 14:"object"};       // reuse the dialect words where we have them

/* split the route into boxes under TomTom's 10,000 km² limit */
function routeBoxes(R){
  const boxes=[]; let b=null;
  const area=x=> (x[3]-x[1])*111 * (x[2]-x[0])*111*Math.cos(rad((x[1]+x[3])/2));
  for(let i=0;i<R.pts.length;i+=3){ const p=R.pts[i];
    const nb = b ? [Math.min(b[0],p.lng),Math.min(b[1],p.lat),Math.max(b[2],p.lng),Math.max(b[3],p.lat)] : [p.lng,p.lat,p.lng,p.lat];
    if(b && area(nb)>8000){ boxes.push(b); b=[p.lng,p.lat,p.lng,p.lat]; } else b=nb; }
  const last=R.pts[R.pts.length-1]; if(b){ b=[Math.min(b[0],last.lng),Math.min(b[1],last.lat),Math.max(b[2],last.lng),Math.max(b[3],last.lat)]; boxes.push(b); }
  return boxes.slice(0,10).map(x=>[x[0]-.01,x[1]-.01,x[2]+.01,x[3]+.01]);
}
async function loadAlerts(R){
  if(!S.ttKey || !S.alertsOn || !R) return null;

  const fields="{incidents{type,geometry{type,coordinates},properties{id,iconCategory,magnitudeOfDelay,events{description,code},startTime,endTime,from,to,length,delay,roadNumbers}}}";
  const feats=new Map();
  await Promise.all(routeBoxes(R).map(async bx=>{
    const url=TT+"/traffic/services/5/incidentDetails?key="+encodeURIComponent(S.ttKey)+"&bbox="+bx.map(v=>v.toFixed(5)).join(",")+
      "&fields="+encodeURIComponent(fields)+"&language=en-GB&timeValidityFilter=present,future&categoryFilter=0,1,2,3,4,7,8,9,10,11,14";
    try{ const j=await (await fetch(url)).json(); (j.incidents||[]).forEach(f=>feats.set(f.properties.id,f)); }catch(e){}
  }));

  if(m==="WALK") return "walk";

  if(/ets|intercity|antarabandar/i.test(ag) || ["LONG_DISTANCE","HIGHSPEED_RAIL","REGIONAL_FAST_RAIL","NIGHT_RAIL"].includes(m)) return "ets";
  if(/ktm|keretapi|komuter/i.test(ag) || ["RAIL","REGIONAL_RAIL","SUBURBAN"].includes(m)) return "ktm";
  if(["SUBWAY","METRO","TRAM","FUNICULAR","CABLE_CAR","AERIAL_LIFT","AREAL_LIFT"].includes(m)) return "rail";
  if(/brt|sunway/i.test(ag) && m==="BUS") return "brt";

const KIND_ICON={freebus:"🚌",walk:"🚶",erl:"🚄",ets:"🚄",ktm:"🚆",rail:"🚇",brt:"🚌",rapidbus:"🚌",bus:"🚌",ferry:"⛴️",car:"🚗",other:"🚐"};

    case "ets": return c(0.13*km, 8, 120);
    case "erl": return c(0.6*km, 7, 35);

async function transitFetch(from, to, opt){

    numItineraries:"5", detailedTransfers:"false", maxPreTransitTime:"1500", maxPostTransitTime:"1500", withFares:"true"});

  if(opt.park) q.set("preTransitModes","WALK,CAR_PARKING");

  let lastErr="no answer";
  for(const v of vers){
    let res; try{ res=await fetch(TRANSIT_API+v+"/plan?"+q.toString()); }catch(e){ throw new Error("the public transport service couldn't be reached"); }
    if(res.status===404) { lastErr="not found"; continue; }

    transitVer=v; return await res.json();

}

async function runPOI(){
  const T=S.poi, c=POI_CATS.find(x=>x.k===T.cat); if(!c) return;
  try{
    let list=[]; T.widened=null;
    if(T.along){
      // along the route: 15-min detour over the next 60 km, then 30 min over 150 km
      for(const [det,km] of [[900,60],[1800,150]]){
        if(S.ttKey) list=await poiAlongRoute(c, det, km);
        if(S.poi!==T) return;
        if(list.length){ if(det>900) T.widened={detour:det/60, km}; break; }
        T.tried={detour:det/60, km};
      }
    } else {
      // nearby: 8 km, then 20 km, then 50 km
      for(const km of [8,20,50]){
        if(S.ttKey) list=await poiNearby(c, km*1000);
        if(!list.length) list=await poiPhoton(c, km*1000);
        if(S.poi!==T) return;
        if(list.length){ if(km>8) T.widened={km}; break; }
        T.tried={km};
      }
    }
    T.list=list.slice(0,15);
  }catch(e){ if(S.poi===T) T.err=(BASE()==="ms"?"Carian tidak tersedia: ":"Search is unavailable: ")+e.message; }
  if(S.poi!==T) return;
  T.loading=false; renderPOI(); drawPOI(T.list, c);
  if(S.gKey && T.list.length){ const at=S.pos||map.getCenter(); (T.along? rateEach(T.list,6) : attachRatings(T.list, c.q, at, Math.min(50000,Math.max(...T.list.map(x=>x.dist||0))+1000))).then(()=>{ if(S.poi===T){ const sc=$("sheet").scrollTop; renderPOI(); $("sheet").scrollTop=sc; } }); }
}
function ttPoi(r){ const a=r.address||{}, br=r.poi?.brands?.[0]?.name;
  return {name:r.poi?.name||a.freeformAddress||"Place", sub:[br && !(r.poi?.name||"").includes(br) ? br : "", a.streetName||a.freeformAddress, a.municipality].filter(Boolean).join(", "),
    cat:[...(r.poi?.categories||[]), ...((r.poi?.classifications||[]).flatMap(c=>(c.names||[]).map(n=>n.name)))].join(" "),
    phone:r.poi?.phone||"", url:r.poi?.url||"", hours:r.poi?.openingHours||null,
    lat:r.position.lat, lng:r.position.lon, dist:r.dist!=null? r.dist : hav(S.pos||map.getCenter(),{lat:r.position.lat,lng:r.position.lon}), detour:r.detourTime??null}; }
async function poiNearby(c, radius=8000){
  const at=S.pos||map.getCenter();
  const url=TT+"/search/2/categorySearch/"+encodeURIComponent(c.q)+".json?key="+encodeURIComponent(S.ttKey)+"&lat="+at.lat.toFixed(5)+"&lon="+at.lng.toFixed(5)+
    "&radius="+radius+"&limit=15&countrySet=MY&language=en-GB&openingHours=nextSevenDays"+(c.cs?"&categorySet="+c.cs:"");
  const res=await fetch(url); if(!res.ok) throw new Error("error "+res.status);
  return ((await res.json()).results||[]).map(ttPoi).sort((a,b)=>a.dist-b.dist);
}
async function poiAlongRoute(c, maxDetour=900, aheadKm=60){
  // the part of the route still ahead of you (up to ~60 km), as at most 300 points
  const R=S.R, near=nearest(R, S.pos||R.pts[0], S.lastIdx||0), start=near.i;
  let end=start; while(end<R.pts.length-1 && R.cum[end]-R.cum[start]<aheadKm*1000) end++;
  const step=Math.max(1,Math.ceil((end-start+1)/300)), pts=[];
  for(let i=start;i<=end;i+=step) pts.push({lat:R.pts[i].lat, lon:R.pts[i].lng});
  if(pts.length<2) pts.push({lat:R.pts[R.pts.length-1].lat, lon:R.pts[R.pts.length-1].lng});
  const url=TT+"/search/2/searchAlongRoute/"+encodeURIComponent(c.q)+".json?key="+encodeURIComponent(S.ttKey)+"&maxDetourTime="+maxDetour+"&limit=15&spreadingMode=auto"+(c.cs?"&categorySet="+c.cs:"");
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({route:{points:pts}})});
  if(!res.ok) throw new Error("error "+res.status);
  const list=((await res.json()).results||[]).map(ttPoi);
  list.forEach(r=>{ const n=nearest(R, r, start); r.dist=Math.max(0,n.along-near.along); });      // distance ahead along the road
  return list.filter(r=>r.dist>50).sort((a,b)=>a.dist-b.dist);
}
async function poiPhoton(c, within=15000){
  const at=S.pos||map.getCenter();
  const url=PHOTON+"?q="+encodeURIComponent(c.n)+"&osm_tag="+encodeURIComponent(c.osm)+"&limit=15&lat="+at.lat+"&lon="+at.lng+"&bbox="+MY_BBOX.join(",");
  const j=await (await fetch(url)).json();
  return (j.features||[]).map(f=>{ const p=f.properties, q={lat:f.geometry.coordinates[1], lng:f.geometry.coordinates[0]};
    return {name:p.name||c.n, sub:[p.street, p.city].filter(Boolean).join(", "), lat:q.lat, lng:q.lng, dist:hav(at,q)}; }).filter(r=>r.dist<within).sort((a,b)=>a.dist-b.dist);
}
