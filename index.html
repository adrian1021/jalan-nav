].map(([name,big,lat,lng,r,en,ms])=>({name,big,lat,lng,r:r*1000,en,ms}));
const foodText = f => BASE()==="ms" ? f.ms : f.en;
function foodAt(p){ let best=null; FOOD_TOWNS.forEach(f=>{ const d=hav(p,f); if(d<f.r+1000 && (!best||d<best.d)) best={...f,d}; }); return best; }
function foodOnRoute(R){
  const end=R.pts[R.pts.length-1], start=R.pts[0], total=R.cum[R.cum.length-1], out=[];
  FOOD_TOWNS.forEach(f=>{ if(hav(end,f)<f.r+1000 || hav(start,f)<f.r+1000) return;
    const n=nearest(R,f,0); if(n.d<f.r+2000 && n.along>2000 && n.along<total-2000) out.push({...f, kind:"food", al:n.along, off:n.d}); });
  return out.sort((a,b)=>a.al-b.al);
}

/* ---------- Wikipedia: sights near the route ---------- */
const WIKI_SKIP=/school|sekolah|^SMK|^SJK|^SK |college|kolej|universit|station|stesen|interchange|persimpangan|toll plaza|plaza tol|highway|expressway|lebuhraya|^jalan |road$|constituency|kawasan|district|daerah|mukim|\bLRT\b|\bMRT\b|\bKTM\b|hospital|klinik|police|polis|\(state|\(federal/i;
function wikiLang(){ return BASE()==="ms" ? "ms" : "en"; }
async function wikiGeo(lang, at, radius, limit){
  const u="https://"+lang+".wikipedia.org/w/api.php?action=query&list=geosearch&format=json&origin=*&gsprop=type&gslimit="+limit+
    "&gsradius="+Math.round(Math.min(10000,radius))+"&gscoord="+at.lat.toFixed(5)+"%7C"+at.lng.toFixed(5);
  const j=await (await fetch(u)).json(); return (j.query&&j.query.geosearch)||[];
}
async function wikiInfo(lang, ids){
  const out={};
  for(let i=0;i<ids.length;i+=20){ const part=ids.slice(i,i+20);
    const u="https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts%7Cinfo%7Cpageimages&exintro=1&explaintext=1&exsentences=2&exlimit=20"+
      "&piprop=thumbnail&pithumbsize=400&pilimit=20&pilicense=any&pageids="+part.join("%7C");
    try{ const j=await (await fetch(u)).json(); Object.values((j.query&&j.query.pages)||{}).forEach(p=> out[p.pageid]=p); }catch(e){} }
  return out;
}
function shortFact(t){
  t=String(t||"").replace(/\s*\([^()]*\)/g,"").replace(/\s*\[[^\]]*\]/g,"").replace(/\s+/g," ").trim();
  const first=(t.match(/^.+?[.!?](\s|$)/)||[t])[0].trim();
  return first.length>230 ? first.slice(0,first.lastIndexOf(" ",225))+"…" : first;
}
async function wikiSights(lang, centres, radius, keep){
  const seen=new Map();
  await Promise.all(centres.map(async c=>{ try{ (await wikiGeo(lang,c,radius,50)).forEach(g=>{ if(!seen.has(g.pageid)) seen.set(g.pageid,g); }); }catch(e){} }));
  let cand=[...seen.values()].filter(g=>!WIKI_SKIP.test(g.title) && !["railwaystation","airport","edu","adm1st","adm2nd","adm3rd","country","state"].includes(g.type));
  cand=cand.map(g=>({id:g.pageid, title:g.title, lat:g.lat, lng:g.lon, type:g.type||""})).filter(keep);
  if(!cand.length) return [];
  const info=await wikiInfo(lang, cand.slice(0,120).map(c=>c.id));
  return cand.map(c=>{ const p=info[c.id]; if(!p) return null;
    return {...c, len:p.length||0, fact:shortFact(p.extract), img:p.thumbnail&&p.thumbnail.source||"", lang, url:"https://"+lang+".wikipedia.org/?curid="+c.id}; })
    .filter(x=>x && x.fact && x.len > (x.type==="city"? 8000 : x.type? 4000 : 6000));
}
async function sightsOnRoute(R){
  const total=R.cum[R.cum.length-1], sp=Math.max(5000,total/14), radius=sp/2+2500, centres=[];
  for(let d=Math.min(2000,total/2); d<total; d+=sp){ let i=0; while(i<R.cum.length-1 && R.cum[i]<d) i++; centres.push(R.pts[i]); }
  const build=async lang=>{
    const list=await wikiSights(lang, centres, radius, c=>{ const n=nearest(R,c,0); c.al=n.along; c.off=n.d; return n.d < (c.type==="city"? 4000 : 1500) && n.along>800 && n.along<total-1500; });
    // keep the most notable place in every 3 km, at most one every ~5 km on average
    list.sort((a,b)=>b.len-a.len); const kept=[];
    list.forEach(s=>{ if(!kept.some(k=>Math.abs(k.al-s.al)<3000)) kept.push(s); });
    return kept.slice(0, Math.max(6, Math.round(total/5000))).sort((a,b)=>a.al-b.al).map(s=>({...s, kind:"sight"}));
  };
  let out=await build(wikiLang());
  if(out.length<4 && wikiLang()!=="en"){ const en=await build("en"); if(en.length>out.length) out=en; }
  return out;
}
async function wikiPhotos(list){
  await Promise.all(list.filter(x=>!x.img && x.title).slice(0,12).map(async x=>{ try{
    const j=await (await fetch("https://"+(x.lang||"en")+".wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(x.title.replace(/ /g,"_")))).json();
    x.img=(j.thumbnail&&j.thumbnail.source)||(j.originalimage&&j.originalimage.source)||""; }catch(e){} }));
  return list;
}
async function sightsNear(p, radius=3000, n=6){
  const pick=async lang=>(await wikiSights(lang,[p],radius,c=>{ c.off=hav(p,c); return c.off<=radius*1.1; })).sort((a,b)=>b.len-a.len).slice(0,n);
  let out=await pick(wikiLang()); if(out.length<3 && wikiLang()!=="en"){ const en=await pick("en"); if(en.length>out.length) out=en; }
  return out;
}

/* ---------- R&R along the whole route (TomTom) ---------- */
async function rnrOnRoute(R){
  if(!S.ttKey) return null;
  const c=POI_CATS.find(x=>x.k==="rnr"), step=Math.max(1,Math.ceil(R.pts.length/300)), pts=[];
  for(let i=0;i<R.pts.length;i+=step) pts.push({lat:R.pts[i].lat, lon:R.pts[i].lng});
  const last=R.pts[R.pts.length-1]; pts.push({lat:last.lat, lon:last.lng});
  const url=TT+"/search/2/searchAlongRoute/"+encodeURIComponent(c.q)+".json?key="+encodeURIComponent(S.ttKey)+"&maxDetourTime=300&limit=20&spreadingMode=auto&categorySet="+c.cs;
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({route:{points:pts}})});
  if(!res.ok) return null;
  return ((await res.json()).results||[]).map(ttPoi).map(r=>{ const n=nearest(R,r,0); return {...r, kind:"rnr", al:n.along, off:n.d}; }).sort((a,b)=>a.al-b.al);
}

/* ---------- the guide for one route (cached on the route) ---------- */
function loadGuide(R){
  if(!R || !S.modes.length) return Promise.resolve(null);
  if(R.guide && R.guide.modes===modeKey()) return Promise.resolve(R.guide);
  if(R.guideP) return R.guideP;
  const end=R.pts[R.pts.length-1], key=modeKey();
  R.guideP=(async()=>{
    const g={modes:key, sights:null, destSights:null, food:[], destFood:null, rnr:null};
    const jobs=[];
    if(modeOn("tour")){ jobs.push(sightsOnRoute(R).then(x=>g.sights=x,()=>g.sights=[])); jobs.push(sightsNear(end).then(x=>g.destSights=x,()=>g.destSights=[])); }
    if(modeOn("makan")){ g.food=foodOnRoute(R); g.destFood=foodAt(end); }
    if(modeOn("family")) jobs.push(rnrOnRoute(R).then(x=>g.rnr=x,()=>g.rnr=null));
    const tag=(k)=>l=>l.map(x=>({...x, kind:k}));
    if(modeOn("tour")) jobs.push(ttAlongRoute(R,"tourist attraction","7376,7317",12).then(tag("attr")).then(x=>g.attr=x,()=>g.attr=[]));
    if(modeOn("makan")) jobs.push(ttAlongRoute(R,"restaurant","7315",15).then(tag("eat")).then(x=>g.eat=x,()=>g.eat=[]));
    if(modeOn("family")) jobs.push(ttAlongRoute(R,"park","9362,9902,9927",10,600).then(tag("fun")).then(x=>g.fun=x,()=>g.fun=[]));
    if(modeOn("cafe")) jobs.push(ttAlongRoute(R,"cafe","",12).then(tag("cafe")).then(l=>rateEach(l,6)).then(x=>g.cafe=x,()=>g.cafe=[]));
    if(modeOn("makan")) jobs.push(Promise.resolve());
    await Promise.all(jobs);
    if(g.eat) await rateEach(g.eat,6);
    if(g.attr && g.sights) g.attr=g.attr.filter(a=>!g.sights.some(s=>hav(s,a)<300 || s.title.toLowerCase()===a.name.toLowerCase()));
    if(modeKey()===key){ R.guide=g; } R.guideP=null; return g;
  })();
  return R.guideP;
}

/* ---------- while driving ---------- */
function guideStart(changed){
  S.g = {said:{}, half:false, almost:false, meals:{}, forR:null, items:[], nextBreak:(S.navT0||Date.now())+2*3600e3, slowT0:0, last:changed? Date.now()-60000 : Date.now(), introDone:!!changed};
  if(!S.modes.length || !S.R) return;
  const R=S.R; loadGuide(R).then(g=>{ if(S.g && S.R && g){ S.g.guide=g; S.g.forR=null; drawModePins(g); } });
}
function guideEnd(){ hideGuideCard(); S.g=null; drawModePins(null); }
function guideItems(){
  const G=S.g, g=G.guide; if(!g) return [];
  if(G.forR!==S.R){ G.forR=S.R;
    G.items=guideAll(g).map(it=>{ const n=nearest(S.R,it,0); return {...it, al:n.along, off:n.d}; })
      .filter(it=> it.off < (it.kind==="food"? it.r+2500 : it.kind==="sight"? (it.type==="city"?4500:2000) : it.kind==="rnr"? 600 : 2500)); }
  return G.items;
}
function sideOf(R, it){
  const n=nearest(R,it,0), a=R.pts[n.i], b=R.pts[n.i+1]||a, k=Math.cos(rad(a.lat));
  const dx=(b.lng-a.lng)*k, dy=b.lat-a.lat, vx=(it.lng-a.lng)*k, vy=it.lat-a.lat;
  if(n.d<120) return "here"; return dx*vy-dy*vx > 0 ? "left" : "right";
}
function gDist(m){ const ms=BASE()==="ms"; if(m>=950){ const k=Math.round(m/100)/10; return k+(ms?" kilometer":(k===1?" kilometre":" kilometres")); } return Math.max(100,Math.round(m/100)*100)+(ms?" meter":" metres"); }
function spokenDur(s){ const m=Math.max(1,Math.round(s/60)), h=Math.floor(m/60), r=m%60, ms=BASE()==="ms";
  const hs=h? h+(ms?" jam":(h>1?" hours":" hour")) : "", rs=r? r+(ms?" minit":(r>1?" minutes":" minute")) : "";
  return [hs,rs].filter(Boolean).join(ms?" ":" and "); }
/* speak guide lines; facts from English Wikipedia use an English voice */
function sayGuide(parts){
  if(!S.voice || !("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel();
    parts.filter(p=>p && p.t).forEach(p=>{ const u=new SpeechSynthesisUtterance(p.t);
      const own = (S.lang==="en"||S.lang==="ms") && P().base===p.l, pk = own ? P() : PACKS[p.l]||PACKS.en, {v}=findVoice(pk);
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang=pk.langs[0]; u.rate=1.0; speechSynthesis.speak(u); }); }catch(e){}
}
function guideTick(near, toMan, remain, leftSec){

      const mn={breakfast:TX("breakfast","sarapan"), lunch:TX("lunch","makan tengah hari"), dinner:TX("dinner","makan malam")}[meal];
      if(town) G.said["f"+town.name]=1;
      return say1([{t:TX("It's "+mn+" time. ","Sudah waktu "+mn+". ")+(town? TX("Makan idea: "+town.name+", in "+gDist(town.al-near.along)+", famous for "+town.en+".","Cadangan: "+town.name+", dalam "+gDist(town.al-near.along)+", terkenal dengan "+town.ms+".")
          : TX("Tap Find makan for places along your route.","Tekan Cari makan untuk tempat makan sepanjang laluan.")), l:LG}],
        {icon:"🍜", title:TX("Time to makan","Masa untuk makan"), text: town? town.name+" · "+fmtDist(town.al-near.along)+" · "+foodText(town) : TX("Restaurants along your route","Restoran sepanjang laluan"),
          actions:[{lbl:"🍜 "+TX("Find makan","Cari makan"), fn:()=>openPOI("food")}]}); }
    const town=items.find(it=>it.kind==="food" && !G.said["f"+it.name] && it.al-near.along>1500 && it.al-near.along<Math.max(6000, spd*240));
    if(town){ G.said["f"+town.name]=1;
      return say1([{t:TX("Makan stop coming up: "+town.name+", famous for "+town.en+".","Hentian makan di hadapan: "+town.name+", terkenal dengan "+town.ms+"."), l:LG}],
        {icon:"🍜", title:town.name, text:TX("Famous for ","Terkenal dengan ")+foodText(town), actions:[{lbl:"🍜 "+TX("Find makan","Cari makan"), fn:()=>openPOI("food")}]}); }
  }
  // café hopper: one coffee-break nudge in the afternoon on longer drives
  if(modeOn("cafe") && !G.coffee){ const hh=new Date().getHours()+new Date().getMinutes()/60;
    if(hh>=14.5 && hh<17.5 && tripSec>2400 && leftSec>1200){ G.coffee=true;
      const c=items.filter(it=>it.kind==="cafe" && it.al>near.along+1500 && it.al<near.along+30000).sort((a,b)=>niceScore(b)-niceScore(a))[0];
      return say1([{t:TX("Coffee time! ","Masa untuk kopi! ")+(c? TX("Nice café ahead: "+c.name+", in "+gDist(c.al-near.along)+(c.rating? ", rated "+c.rating.toFixed(1)+" stars." : "."),"Kafe di hadapan: "+c.name+", dalam "+gDist(c.al-near.along)+".") : TX("Tap Find for cafés along your route.","Tekan Cari untuk kafe sepanjang laluan.")), l:LG}],
        {icon:"☕", title:TX("Coffee break?","Rehat kopi?"), text: c? c.name+" · "+fmtDist(c.al-near.along)+(c.rating?" · ★ "+c.rating.toFixed(1):"") : TX("Cafés along your route","Kafe sepanjang laluan"),
          actions:[ c? {lbl:TX("+ Add stop","+ Singgah"), fn:()=>addGuideStop(c)} : null, {lbl:"☕ "+TX("Cafés","Kafe"), fn:()=>openPOI("cafe")} ]}); } }
  // tourist: a sight about 30 seconds ahead
  if(modeOn("tour")){
    const ahead=Math.max(700, spd*35);
    const s=items.find(it=>it.kind==="sight" && !G.said["s"+it.id] && it.al-near.along>100 && it.al-near.along<ahead);
    items.forEach(it=>{ if(it.kind==="sight" && it.al<near.along-200) G.said["s"+it.id]=1; });
    if(s){ G.said["s"+s.id]=1;
      const side=sideOf(R,s), city=s.type==="city";
      const lead = city ? TX("Passing "+s.title+".","Melalui "+s.title+".")
        : side==="here" ? TX("Right here: "+s.title+".","Di sini: "+s.title+".")
        : TX("On your "+side+": "+s.title+".", "Di sebelah "+(side==="left"?"kiri":"kanan")+": "+s.title+".");
      return say1([{t:lead, l:LG}, {t:s.fact, l:s.lang}],
        {icon:city?"🏙️":"🏛️", img:s.img, title:s.title, text:s.fact, more:s.url, actions:[{lbl:TX("+ Add stop","+ Singgah"), fn:()=>addGuideStop({name:s.title, lat:s.lat, lng:s.lng})}]}); }
  }
}

const JV={key:null, imgs:new Map(), big:false};
function jvTileUrl(z,x,y){ return (S.ttKey && !S.satFallback) ? TT+"/map/1/tile/sat/main/"+z+"/"+x+"/"+y+".jpg?key="+encodeURIComponent(S.ttKey)
  : "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/"+z+"/"+y+"/"+x; }
function jvAt(R, al){ al=Math.max(0,Math.min(al,R.cum[R.cum.length-1])); let lo=0, hi=R.cum.length-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(R.cum[m]<=al) lo=m; else hi=m; }
  const a=R.pts[lo], b=R.pts[hi], f=(al-R.cum[lo])/Math.max(1e-6,R.cum[hi]-R.cum[lo]);
  return {lat:a.lat+(b.lat-a.lat)*f, lng:a.lng+(b.lng-a.lng)*f}; }
function jvWorld(p,z){ const s=256*Math.pow(2,z), sl=Math.sin(rad(p.lat));
  return {x:(p.lng+180)/360*s, y:(0.5-Math.log((1+sl)/(1-sl))/(4*Math.PI))*s}; }
function jvWanted(step, toMan){
  const t=step.maneuver.type, m=step.maneuver.modifier||"straight";
  if(t==="arrive"||t==="waypoint"||t==="depart") return false;
  if((t==="continue"||t==="new name") && m==="straight") return false;
  return toMan<1500;
}

/* TomTom places along the whole route for each mode */
async function ttAlongRoute(R, q, cs, limit=12, detour=420){
  if(!S.ttKey) return [];
  const step=Math.max(1,Math.ceil(R.pts.length/300)), pts=[];
  for(let i=0;i<R.pts.length;i+=step) pts.push({lat:R.pts[i].lat, lon:R.pts[i].lng});
  const last=R.pts[R.pts.length-1]; pts.push({lat:last.lat, lon:last.lng});
  const url=TT+"/search/2/searchAlongRoute/"+encodeURIComponent(q)+".json?key="+encodeURIComponent(S.ttKey)+"&maxDetourTime="+detour+"&limit="+limit+"&spreadingMode=auto"+(cs?"&categorySet="+cs:"");
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({route:{points:pts}})});
  if(!res.ok) return [];
  return ((await res.json()).results||[]).map(ttPoi).map(r=>{ const n=nearest(R,r,0); return {...r, al:n.along, off:n.d}; }).sort((a,b)=>a.al-b.al);
}

/* ================= tour briefing (spoken, like a tour guide) ================= */
S.briefing=false;
function briefLabel(){ return S.briefing ? "⏹ "+TX("Stop briefing","Henti taklimat") : "▶ "+TX("Play tour briefing","Main taklimat pelancong"); }
async function wikiIntro(lang, id, n=3){
  try{ const j=await (await fetch("https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=extracts&exintro=1&explaintext=1&exsentences="+n+"&pageids="+id)).json();
    const p=Object.values(j.query.pages)[0]; return String(p.extract||"").replace(/\s*\([^()]*\)/g,"").replace(/\s+/g," ").trim(); }catch(e){ return ""; }
}
async function placeIntro(at){       // the town or city you're in
  for(const lang of [...new Set([wikiLang(),"en"])]){
    try{ const g=(await wikiGeo(lang,at,10000,50)).filter(x=>x.type==="city" && !WIKI_SKIP.test(x.title));
      if(!g.length) continue; g.sort((a,b)=>a.dist-b.dist); const best=g[0];
      const txt=await wikiIntro(lang,best.pageid,3); if(txt) return {title:best.title, text:txt, lang}; }catch(e){} }
  return null;
}
function sentences(t){ return String(t||"").split(/(?<=[.!?])\s+(?=[A-Z0-9"“(])/).map(s=>s.trim()).filter(Boolean); }
async function toggleBriefing(kind){
  if(S.briefing){ stopBriefing(); return; }
  S.briefing=true; refreshBriefBtn(); toast(TX("Preparing your tour briefing…","Menyediakan taklimat…"));
  const LG=BASE()==="ms"?"ms":"en", parts=[], T=(t,l)=>sentences(t).forEach(s=>parts.push({t:s,l:l||LG}));

      T(TX("Welcome aboard! Today we're heading to "+S.dest.name+", about "+gDist(left)+" away.","Selamat datang! Hari ini kita menuju ke "+S.dest.name+", lebih kurang "+gDist(left)+" lagi."));
      const sights=((g&&g.sights)||[]).filter(s=>s.al>near).slice(0,6);

      const food=((g&&g.food)||[]).filter(f=>f.al>near);
      food.forEach(f=>T(TX("In "+f.name+", try the "+f.en+".","Di "+f.name+", cubalah "+f.ms+".")));
      const d=await placeIntro({lat:S.dest.lat, lng:S.dest.lng});
      if(d){ T(TX("About your destination, "+d.title+".","Tentang destinasi anda, "+d.title+".")); T(d.text, d.lang); }
      if(g && g.destFood) T(TX("When you get there, don't miss the "+g.destFood.en+".","Bila sampai, jangan lepaskan "+g.destFood.ms+"."));
      T(TX("That's your briefing. Enjoy the ride!","Itu sahaja taklimat. Selamat menikmati perjalanan!"));
    } else {
      const at=S.pos||map.getCenter(), d=await placeIntro(at);
      if(d){ T(TX("You're in "+d.title+".","Anda berada di "+d.title+".")); T(d.text, d.lang); }
      const s=(await sightsNear(at,10000,5));
      if(s.length){ T(TX("Places worth visiting nearby.","Tempat menarik berdekatan.")); s.forEach(x=>{ T(x.title+", "+fmtDist(x.off)+TX(" away."," dari sini.")); T(x.fact, x.lang); }); }
      const f=foodAt(at); if(f) T(TX("While you're here, try the "+f.en+".","Semasa di sini, cubalah "+f.ms+"."));
      if(!parts.length) T(TX("Sorry, I couldn't find much about this area.","Maaf, tiada banyak maklumat tentang kawasan ini."));
    }
  }catch(e){ T(TX("Sorry, the briefing couldn't load. Check your connection.","Maaf, taklimat tidak dapat dimuatkan.")); }
  if(!S.briefing) return;
  playParts(parts);
}
function playParts(parts){
  if(!("speechSynthesis" in window)){ S.briefing=false; refreshBriefBtn(); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const bar=$("briefBar"); bar.hidden=false; $("briefTxt").textContent=TX("Tour briefing","Taklimat pelancong");
  let i=0;
  const next=()=>{ if(!S.briefing) return; if(i>=parts.length){ stopBriefing(); return; }
    const p=parts[i++], u=new SpeechSynthesisUtterance(p.t);
    const own=(S.lang==="en"||S.lang==="ms") && P().base===p.l, pk=own? P() : PACKS[p.l]||PACKS.en, {v}=findVoice(pk);
    if(v){ u.voice=v; u.lang=v.lang; } else u.lang=pk.langs[0]; u.rate=0.98;
    u.onend=()=>setTimeout(next,250); u.onerror=()=>setTimeout(next,250);
    $("briefTxt").textContent=p.t.length>70? p.t.slice(0,68)+"…" : p.t;
    try{ speechSynthesis.speak(u); }catch(e){ stopBriefing(); } };
  S.briefNext=next; next();
}
function stopBriefing(){ S.briefing=false; try{ speechSynthesis.cancel(); }catch(e){} const b=$("briefBar"); if(b) b.hidden=true; refreshBriefBtn(); }
function refreshBriefBtn(){ document.querySelectorAll("#brief,#xBrief,#rBrief").forEach(b=> b.textContent=briefLabel()); }

/* ================= Google star ratings (optional: needs your own Google Maps key) ================= */
S.gKey = store.get("gkey", "");
let gLib=null;
function loadGoogle(){
  if(!S.gKey) return Promise.reject(new Error("no key"));
  if(gLib) return gLib;
  gLib=new Promise((res,rej)=>{
    const t=setTimeout(()=>{ gLib=null; rej(new Error("Google didn't respond")); }, 15000);
    window.__gmInit=()=>{ google.maps.importLibrary("places").then(l=>{ clearTimeout(t); res(l); }, e=>{ clearTimeout(t); gLib=null; rej(e); }); };
    const sc=document.createElement("script");
    sc.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(S.gKey)+"&v=weekly&loading=async&callback=__gmInit";
    sc.async=true; sc.onerror=()=>{ clearTimeout(t); gLib=null; rej(new Error("Google script failed")); };
    document.head.appendChild(sc);
  });
  return gLib;
}
window.gm_authFailure=()=>{ S.gErr=true; gLib=null; toast(TX("Google key was rejected. Check it in ⚙ (Maps JavaScript API and Places API (New) must be enabled).","Kunci Google ditolak. Semak dalam ⚙.")); };
const G_FIELDS=["id","displayName","rating","userRatingCount","location","googleMapsURI","formattedAddress","primaryType"];
async function gSearch(q, at, radius=3000, n=20){
  const {Place}=await loadGoogle();
  const {places}=await Place.searchByText({textQuery:q, fields:G_FIELDS, locationBias:{center:{lat:at.lat,lng:at.lng}, radius:Math.min(50000,Math.max(500,radius))}, maxResultCount:n, language:"en", region:"my"});
  return (places||[]).map(p=>{ const lat=typeof p.location.lat==="function"? p.location.lat() : p.location.lat, lng=typeof p.location.lng==="function"? p.location.lng() : p.location.lng;
    return {name:p.displayName, sub:p.formattedAddress||"", lat, lng, rating:p.rating||null, count:p.userRatingCount||0, gurl:p.googleMapsURI||"", gtype:p.primaryType||"", dist:hav(at,{lat,lng})}; });
}
const RATE_CACHE=new Map();
async function gSearchCached(q, at, radius, n){ const k=q+"@"+at.lat.toFixed(3)+","+at.lng.toFixed(3)+":"+radius+":"+n; if(!RATE_CACHE.has(k)) RATE_CACHE.set(k, gSearch(q,at,radius,n).catch(e=>{ RATE_CACHE.delete(k); throw e; })); return RATE_CACHE.get(k); }
function nameWords(s){ return String(s||"").toLowerCase().normalize("NFKD").replace(/[̀-ͯ]/g,"").replace(/\b(restoran|restaurant|kedai|makan|cafe|caf[eé]|coffee|sdn|bhd|the|and|dan)\b/g," ").replace(/[^a-z0-9]+/g," ").split(" ").filter(w=>w.length>2); }
function sameName(a,b){ const A=nameWords(a), B=nameWords(b); if(!A.length||!B.length) return String(a).toLowerCase()===String(b).toLowerCase(); return A.filter(w=>B.includes(w)).length >= Math.min(A.length,B.length,2)*0.5+0.01; }
/* add Google ratings to places found elsewhere: one area search, matched by name and position */
async function attachRatings(list, q, at, radius){
  if(!S.gKey || !list || !list.length) return list;
  try{ const g=await gSearchCached(q, at, radius, 20);
    list.forEach(p=>{ if(p.rating) return; const nm=p.name||p.title; const m=g.find(x=>hav(x,p)<250 && sameName(x.name,nm)); if(m){ p.rating=m.rating; p.count=m.count; p.gurl=m.gurl; } }); }catch(e){}
  return list;
}
/* one place at a time (for places spread along a route) */
async function rateEach(list, max=5){
  if(!S.gKey || !list) return list;
  await Promise.all(list.slice(0,max).map(async p=>{ if(p.rating) return; const nm=p.name||p.title;
    try{ const g=await gSearchCached(nm, p, 400, 3); const m=g.find(x=>hav(x,p)<300 && sameName(x.name,nm)); if(m){ p.rating=m.rating; p.count=m.count; p.gurl=m.gurl; } }catch(e){} }));
  return list;
}
const niceScore = p => (p.rating||0) * Math.log10((p.count||0)+10);
function starsHTML(p){
  const r=Math.round(p.rating*10)/10, n=p.count||0, cnt=n>=1000? (n/1000).toFixed(n>=10000?0:1)+"k" : n;
  return '<a class="grate" href="'+esc(p.gurl||gReviewURL(p.name||p.title,p.sub,p.lat,p.lng))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><span class="stars" style="--r:'+r+'">★★★★★</span> <b>'+r.toFixed(1)+'</b> <small>('+cnt+') Google</small></a>';
}

/* colourful icons for food places, by cuisine */
function foodEmoji(p, cafe){
  const t=((p.name||p.title||"")+" "+(p.cat||"")+" "+(p.gtype||"")).toLowerCase();

/* ================= traffic lights and speed cameras on the route (OpenStreetMap) ================= */
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
async function overpass(q){
  let last;
  for(const u of OVERPASS){ try{ const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
      if(r.ok) return await r.json(); last=new Error("HTTP "+r.status); }catch(e){ last=e; } }
  throw last||new Error("Overpass unavailable");
}
function thinRoute(R, every){ const out=[]; let last=-1e9; R.pts.forEach((p,i)=>{ if(R.cum[i]-last>=every || i===R.pts.length-1){ out.push(p); last=R.cum[i]; } }); return out; }
let sigLayer=null;
async function loadSignals(R){
  if(R.sig || R.sigP) return R.sigP;
  R.sigP=(async()=>{
    const pts=thinRoute(R, 60), chunks=[];
    for(let i=0;i<pts.length;i+=140) chunks.push(pts.slice(Math.max(0,i-1), i+140));
    const found=new Map();
    for(const ch of chunks.slice(0,12)){
      const line=ch.map(p=>p.lat.toFixed(5)+","+p.lng.toFixed(5)).join(",");
      const q='[out:json][timeout:20];(node["highway"="traffic_signals"](around:22,'+line+');node["highway"="speed_camera"](around:45,'+line+'););out;';
      try{ (await overpass(q)).elements.forEach(e=>found.set(e.id,e)); }catch(e){}
    }
    const list=[];
    found.forEach(e=>{ const p={lat:e.lat,lng:e.lon}, n=nearest(R,p,0), cam=e.tags && e.tags.highway==="speed_camera";
      if(n.d < (cam?45:25)) list.push({lat:e.lat, lng:e.lon, al:n.along, kind:cam?"cam":"light", max:cam? parseInt((e.tags.maxspeed||"").replace(/\D/g,""))||null : null, id:e.id}); });
    list.sort((a,b)=>a.al-b.al);
    // one light per junction
    const out=[]; list.forEach(s=>{ if(s.kind==="light" && out.some(o=>o.kind==="light" && Math.abs(o.al-s.al)<60)) return; out.push(s); });
    R.sig=out; R.sigP=null; return out;
  })();
  return R.sigP;
}
function drawSignals(R){
  clearSignals();
  (R && R.sig || []).forEach(s=>{
    const html = s.kind==="cam" ? '<div class="sigpin cam" data-sid="'+s.id+'"><span class="ring"></span>📷'+(s.max?'<em>'+s.max+'</em>':'')+'</div>'
      : '<div class="sigpin light" data-sid="'+s.id+'"><span class="ring"></span><i></i><i></i><i></i></div>';
    s.up=uprightAdd(s, html, -50, s.kind==="cam"? -50 : -90); SIGS.push(s);
  });
}
const SIGS=[];
function clearSignals(){ SIGS.splice(0).forEach(s=>{ if(s.up){ s.up.remove(); s.up=null; } }); }
function sigEl(s){ return s.up && s.up.el.querySelector(".sigpin"); }
/* blinking circle as you get close; a voice warning and banner for speed cameras */
function sigCheck(near){

    a.innerHTML='<span class="camblink">📷</span><span>'+TX("Speed camera","Kamera laju")+' · '+fmtDist(d)+(cam.max?' · '+TX("limit ","had ")+cam.max+' km/j':'')+'</span>';

/* ================= junction drawing: the real road layout, turned to your direction ================= */
const JD={cache:new Map()};
async function junctionRoads(p){
  const k=p.lat.toFixed(4)+","+p.lng.toFixed(4);
  if(JD.cache.has(k)) return JD.cache.get(k);
  const pr=overpass('[out:json][timeout:10];way(around:80,'+p.lat.toFixed(6)+','+p.lng.toFixed(6)+')["highway"~"^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|service|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$"];out geom;')
    .then(j=>(j.elements||[]).filter(w=>w.geometry).map(w=>({hw:w.tags.highway, rb:w.tags.junction==="roundabout", pts:w.geometry.map(g=>({lat:g.lat,lng:g.lon}))})))
    .catch(()=>{ JD.cache.delete(k); return null; });
  JD.cache.set(k, pr); return pr;
}
function jvDraw(){
  const cv=$("jvCanvas"); if(!cv || !JV.R) return;
  const R=JV.R, al=JV.al, ctx=cv.getContext("2d"), W=cv.width, H=cv.height, roads=JV.roads;
  const jp=jvAt(R,al), back=jvAt(R,Math.max(0,al-40)), hdg=rad(bearing(back,jp));
  const span=JV.fast?150:90, sc=(H*0.62)/span, cx=W/2, cy=H*0.62, k=Math.cos(rad(jp.lat));
  const xy=p=>{ const x=(p.lng-jp.lng)*k*111320, y=-(p.lat-jp.lat)*110540, c=Math.cos(-hdg), s=Math.sin(-hdg); return [cx+(x*c-y*s)*sc, cy+(x*s+y*c)*sc]; };
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,W,H);
  ctx.fillStyle=getVar("--sign-deep")||"#0b4a33"; ctx.fillRect(0,0,W,H);
  const line=(pts,col,wd)=>{ if(pts.length<2) return; ctx.beginPath(); pts.forEach(([x,y],i)=> i?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.strokeStyle=col; ctx.lineWidth=wd; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.stroke(); };
  const wide=hw=>/motorway|trunk/.test(hw)? 22 : /primary|secondary/.test(hw)? 18 : /link/.test(hw)? 14 : 13;
  if(roads && roads.length){
    roads.forEach(r=>line(r.pts.map(xy),"rgba(255,255,255,.28)",wide(r.hw)+6));
    roads.forEach(r=>line(r.pts.map(xy),"#c9d3cf",wide(r.hw)));
  } else {
    // still loading or offline: approach road plus the roads you could take
    const m=(R.steps[JV.nxt]||{}).maneuver||{}, t=m.type||"", fwd=jvAt(R,al+80);
    const ext=(deg,len)=>{ const b=rad(bearing(back,jp)+deg), d=len/6371000, la1=rad(jp.lat), lo1=rad(jp.lng);
      const la2=Math.asin(Math.sin(la1)*Math.cos(d)+Math.cos(la1)*Math.sin(d)*Math.cos(b)); return {lat:la2*180/Math.PI, lng:(lo1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(la1),Math.cos(d)-Math.sin(la1)*Math.sin(la2)))*180/Math.PI}; };
    const stubs=[[ext(180,span),jp]];
    if(/fork|ramp|merge/.test(t)) stubs.push([jp, ext(m.modifier&&m.modifier.includes("left")?18:-18, span)]);
    else { stubs.push([jp, ext(0,span)]); stubs.push([ext(90,span*0.8), ext(-90,span*0.8)]); }
    stubs.forEach(s=>line(s.map(xy),"#c9d3cf",16)); void fwd;
  }
  // your path through the junction
  const path=[]; for(let d=al-span; d<=al+span*0.85; d+=4) path.push(xy(jvAt(R,d)));
  line(path,"#ffffff",15); line(path,"#2fa8ff",10);
  const [x1,y1]=path[path.length-1], [x0,y0]=path[Math.max(0,path.length-5)], a=Math.atan2(y1-y0,x1-x0);
  ctx.beginPath(); ctx.moveTo(x1+Math.cos(a)*18,y1+Math.sin(a)*18); ctx.lineTo(x1+Math.cos(a+2.3)*16,y1+Math.sin(a+2.3)*16); ctx.lineTo(x1+Math.cos(a-2.3)*16,y1+Math.sin(a-2.3)*16); ctx.closePath();
  ctx.fillStyle="#2fa8ff"; ctx.strokeStyle="#fff"; ctx.lineWidth=4; ctx.stroke(); ctx.fill();
  // you
  ctx.beginPath(); ctx.arc(cx, cy+span*0.75*sc, 7, 0, 2*Math.PI); ctx.fillStyle="#fff"; ctx.fill(); ctx.beginPath(); ctx.arc(cx, cy+span*0.75*sc, 4.5, 0, 2*Math.PI); ctx.fillStyle="#1b7cf2"; ctx.fill();
}
function jvUpdate(R, nxt, toMan, step){
  const box=$("jview"); if(!box) return;
  if(!S.jview || !jvWanted(step,toMan)){ if(!box.hidden){ box.hidden=true; } JV.key=null; return; }
  const key=R.at+":"+nxt;
  box.hidden=false;
  if(JV.key===key) return;
  JV.key=key; JV.R=R; JV.nxt=nxt; JV.al=R.cum[R.stepStart[nxt]]; JV.roads=null; JV.fast=(S.speed||0)>16 || /ramp|fork|merge/.test(step.maneuver.type);

  [/north.{0,3}south|utara.{0,3}selatan/i,"PLUS"], [/east coast|pantai timur/i,"LPT"], [/kuala lumpur.{0,3}karak|\bkarak\b/i,"Karak Hwy"],
  [/smart tunnel|terowong smart/i,"SMART"], [/middle ring road 2|lingkaran tengah 2|\bmrr ?2\b/i,"MRR2"], [/west coast expressway|pesisiran pantai barat/i,"WCE"],
  [/setiawangsa.{0,3}pantai/i,"SPE"], [/cheras.{0,3}kajang/i,"Cheras–Kajang"], [/federal highway|lebuhraya persekutuan/i,"Federal Hwy"],
  [/kuala lumpur.{0,3}kuala selangor|\blatar\b/i,"LATAR"], [/besraya|sungai besi expressway/i,"BESRAYA"]];
function shortRoad(name, ref){
  name=String(name||"").trim(); ref=String(ref||"").trim();
  const hit=ROAD_ABBR.find(([re])=>re.test(name));
  let nm = hit ? hit[1] : name.replace(/\bJalan\b/g,"Jln").replace(/\bPersiaran\b/g,"Psn").replace(/\bLorong\b/g,"Lrg").replace(/\bLebuhraya\b/g,"Lbh").replace(/\bTaman\b/g,"Tmn").replace(/\bBandar\b/g,"Bdr").replace(/\bExpressway\b/g,"Expwy").replace(/\bHighway\b/g,"Hwy");

  return [ref, nm].filter(Boolean).join(" ");
}

/* ================= turn arrows: you come in straight from below, then the turn (like Naver) ================= */
function arrowSVG(step){
  const m=step.maneuver||{}, t=m.type||"", mod=m.modifier||"straight";
  const W='stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"', G='stroke="#fff" stroke-opacity=".38" stroke-width="5" fill="none" stroke-linecap="round"';
  if(t==="arrive"||t==="waypoint") return '<svg viewBox="0 0 48 48"><path d="M24 44V30" '+W+'/><circle cx="24" cy="18" r="10" fill="none" stroke="#fff" stroke-width="5"/><circle cx="24" cy="18" r="4" fill="#fff"/></svg>';
  if(mod==="uturn") return '<svg viewBox="0 0 48 48"><path d="M30 44V20a8 8 0 0 0-16 0v6" '+W+'/><path d="M8 22l6 7 6-7" '+W+'/></svg>';
  const head=(x,y,a)=>{ const dx=Math.cos(a), dy=Math.sin(a), px=-dy, py=dx; return '<path d="M'+(x+dx*7).toFixed(1)+' '+(y+dy*7).toFixed(1)+'L'+(x+px*7).toFixed(1)+' '+(y+py*7).toFixed(1)+'L'+(x-px*7).toFixed(1)+' '+(y-py*7).toFixed(1)+'Z" fill="#fff"/>'; };
  if(t==="roundabout"||t==="rotary"){       // Malaysia drives on the left: round the roundabout clockwise
    const cx=24, cy=19, r=9, exA={left:180, "slight left":205, straight:270, "slight right":315, right:360, "sharp right":20+360, "sharp left":150}[mod] ?? 270;
    const a0=90*Math.PI/180, a1=exA*Math.PI/180, P=a=>[cx+r*Math.cos(a), cy+r*Math.sin(a)], [sx,sy]=P(a0), [ex,ey]=P(a1), large=(exA-90)>180?1:0;
    const ox=ex+Math.cos(a1)*9, oy=ey+Math.sin(a1)*9;
    return '<svg viewBox="0 0 48 48"><circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" '+G+'/><path d="M24 46V'+(sy+1).toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+ex.toFixed(1)+' '+ey.toFixed(1)+' L'+ox.toFixed(1)+' '+oy.toFixed(1)+'" '+W+'/>'+head(ox,oy,a1)+
      (m.exit? '<text x="24" y="23" text-anchor="middle" font-size="10" font-weight="800" fill="#fff" font-family="Barlow Condensed,sans-serif">'+m.exit+'</text>' : '')+'</svg>';
  }
  const deg={straight:0,"slight right":40,right:90,"sharp right":140,"sharp left":-140,left:-90,"slight left":-40}[mod]||0, th=deg*Math.PI/180;
  const sharp=Math.abs(deg)>100, sx=sharp? 24-14*Math.sin(th) : 24-10*Math.sin(th), cy=sharp? 12 : 24, L=sharp? 19 : Math.abs(deg)<45? 14 : 13;
  const dx=Math.sin(th), dy=-Math.cos(th), ex=sx+dx*L, ey=cy+dy*L, bx=sx+dx*4, by=cy+dy*4;
  const ghost = (t==="fork"||t==="off ramp"||t==="merge"||t==="on ramp") && deg!==0 ? '<path d="M'+sx+' '+cy+'V6" '+G+'/>' : '';
  const body = deg===0 ? '<path d="M24 46V12" '+W+'/>'+head(24,10,-Math.PI/2)
    : ghost+'<path d="M'+sx+' 46V'+(cy+4)+' Q'+sx+' '+cy+' '+bx.toFixed(1)+' '+by.toFixed(1)+' L'+ex.toFixed(1)+' '+ey.toFixed(1)+'" '+W+'/>'+head(ex,ey,Math.atan2(dy,dx));
  return '<svg viewBox="0 0 48 48">'+body+'</svg>';
}

/* ================= lanes and speed limits from the route (TomTom sections) ================= */
const LANE_DEG={STRAIGHT:0,SLIGHT_RIGHT:40,RIGHT:90,SHARP_RIGHT:140,SLIGHT_LEFT:-40,LEFT:-90,SHARP_LEFT:-140,U_TURN:180,UTURN:180};
function laneArrow(dir, on){
  const d=LANE_DEG[dir]; if(d==null) return "";

  if(d===180) return '<path d="M17 28V14a5 5 0 0 0-10 0v4" stroke="'+col+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const th=d*Math.PI/180, ex=12+Math.sin(th)*9, ey=12-Math.cos(th)*9;
  return '<path d="M12 28V'+(d?14:5)+(d?' L'+ex.toFixed(1)+' '+ey.toFixed(1):'')+'" stroke="'+col+'" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+(d?ex:12).toFixed(1)+'" cy="'+(d?ey:4).toFixed(1)+'" r="2.6" fill="'+col+'"/>';
}
function lanesHTML(sec){

    return '<span class="lane'+(rec?" on":"")+'"><svg viewBox="0 0 24 30">'+dirs.map(d=>laneArrow(d, rec && (d===l.f || dirs.length===1))).join("")+'</svg></span>'; }).join("");

function laneCheck(R, near){

/* speed-limit sign beside your speed; the speed turns red and blinks when you're over */

const SAFE_UP=[];

async function safeLoad(p){

  try{ const j=await overpass('[out:json][timeout:15];(node["highway"="traffic_signals"](around:2500,'+p.lat.toFixed(5)+','+p.lng.toFixed(5)+');node["highway"="speed_camera"](around:3000,'+p.lat.toFixed(5)+','+p.lng.toFixed(5)+'););out;');

    const items=[]; (j.elements||[]).forEach(e=>{ const cam=e.tags&&e.tags.highway==="speed_camera"; const it={id:e.id, lat:e.lat, lng:e.lon, kind:cam?"cam":"light", max:cam? parseInt((e.tags.maxspeed||"").replace(/\D/g,""))||null : null};
      if(it.kind==="light" && items.some(o=>o.kind==="light" && hav(o,it)<45)) return; items.push(it); });

      say(S.lang==="ms"? "Perlahankan, had laju "+Math.round(T.limit) : "Slow down, the speed limit is "+Math.round(T.limit)); } }

/* ================= place overview: street photo (Mapillary), hours, halal, contact, Google reviews link ================= */
const MAPILLARY_TOKEN = "MLY|28745945978407630|eceb6e61683a42c83d1ad3076cc46765";     // free token from mapillary.com/dashboard/developers (no card needed); also settable in ⚙
function mlyToken(){ return MAPILLARY_TOKEN || store.get("mly",""); }
const MLY_CACHE=new Map();
/* the street-level photo nearest to the place, preferring one that faces it */
async function streetPhoto(p){
  const tok=mlyToken(); if(!tok || p.lat==null) return null;
  const k=(+p.lat).toFixed(5)+","+(+p.lng).toFixed(5); if(MLY_CACHE.has(k)) return MLY_CACHE.get(k);
  const pr=(async()=>{
    for(const d of [0.0004,0.0009]){
      const bbox=[p.lng-d,p.lat-d,p.lng+d,p.lat+d].map(v=>v.toFixed(6)).join(",");
      const j=await (await fetch("https://graph.mapillary.com/images?access_token="+encodeURIComponent(tok)+"&fields=id,thumb_1024_url,captured_at,compass_angle,computed_geometry,geometry&limit=40&bbox="+bbox)).json();
      const list=(j.data||[]).map(im=>{ const g=(im.computed_geometry||im.geometry||{}).coordinates||[]; if(!g.length) return null;
        const at={lat:g[1],lng:g[0]}, dist=hav(at,p), face=im.compass_angle!=null? Math.abs(angDiff(bearing(at,p), im.compass_angle)) : 90;
        return {url:im.thumb_1024_url, when:im.captured_at, score:dist + face*0.6, dist}; }).filter(x=>x && x.url);
      if(list.length){ list.sort((a,b)=>a.score-b.score); return list[0]; }
    }
    return null;
  })().catch(()=>null);
  MLY_CACHE.set(k, pr); return pr;
}
/* OpenStreetMap details for the same place: cuisine, halal, hours, website, phone */
async function osmDetails(p){
  try{ const j=await overpass('[out:json][timeout:10];nwr(around:60,'+(+p.lat).toFixed(6)+','+(+p.lng).toFixed(6)+')[name];out tags center 20;');
    const nm=p.name||p.title||""; const hit=(j.elements||[]).find(e=>e.tags && sameName(e.tags.name||"", nm)) ; return hit? hit.tags : null; }catch(e){ return null; }
}
function hoursToday(p){
  const tr=p.hours && p.hours.timeRanges; if(!tr || !tr.length) return null;
  const now=new Date(), today=new Date(now.getTime()+8*3600e3).toISOString().slice(0,10), t=x=>new Date(x.date+"T"+String(x.hour).padStart(2,"0")+":"+String(x.minute).padStart(2,"0")+":00+08:00");
  const open=tr.some(r=> t(r.startTime)<=now && now<t(r.endTime));
  const todays=tr.filter(r=>r.startTime.date===today).map(r=>String(r.startTime.hour).padStart(2,"0")+":"+String(r.startTime.minute).padStart(2,"0")+"–"+String(r.endTime.hour).padStart(2,"0")+":"+String(r.endTime.minute).padStart(2,"0"));
  return {open, today:todays.join(", ")};
}

      (p.fact? '<p class="pfact">'+esc(p.fact)+'</p>' : '')+
      '<div class="gbtns pacts"><button class="pbtn go" id="pGo">▶ '+TX("Go","Pergi")+'</button>'+
        '<a class="pbtn" href="'+esc(p.gurl||gReviewURL(nm,p.sub))+'" target="_blank" rel="noopener">★ '+TX("Google reviews","Ulasan Google")+'</a>'+
        (phone? '<a class="pbtn" href="tel:'+esc(phone.replace(/[^\d+]/g,""))+'">📞 '+TX("Call","Telefon")+'</a>' : '')+
        (web? '<a class="pbtn" href="'+esc(/^https?:/.test(web)? web : "https://"+web)+'" target="_blank" rel="noopener">🌐 '+TX("Website","Laman web")+'</a>' : '')+
        '<button class="pbtn" id="pShare">↗ '+TX("Share","Kongsi")+'</button></div>'+
      '<p class="hint">'+TX("Hours and contact from TomTom; halal and cuisine from OpenStreetMap when known.","Waktu dan hubungan dari TomTom; halal dan masakan dari OpenStreetMap jika ada.")+'</p>';
    const sc=$("sheet").classList.contains("closed")?0:$("sheet").scrollTop;
    openSheet(h2, ()=>{ S.placeOpen=null; back? back() : afterSheet(); }); $("sheet").scrollTop=sc;
    $("pGo").onclick=()=>{ S.placeOpen=null; setTab(null); closeSheet(); if(S.nav) navGoTo({name:nm, sub:p.sub||"", lat:p.lat, lng:p.lng}); else setDest({name:nm, sub:p.sub||"", lat:p.lat, lng:p.lng}); };
    $("pStar").onclick=()=>starPlace(p, draw);
    $("pShare").onclick=async()=>{ const url="https://www.google.com/maps/search/?api=1&query="+(+p.lat).toFixed(6)+","+(+p.lng).toFixed(6), text=nm+(p.sub?" – "+p.sub:"");
      try{ if(navigator.share) await navigator.share({title:nm, text, url}); else { await navigator.clipboard.writeText(text+" "+url); toast(TX("Link copied","Pautan disalin")); } }catch(e){} };
  };
  S.placeOpen=p; draw();
  if(st.photo===undefined) streetPhoto(p).then(x=>{ st.photo=x; draw(); });
  osmDetails(p).then(x=>{ st.osm=x; if(x && !p.phone && !p.url && !x.cuisine && !x["diet:halal"] && !x.opening_hours) return; draw(); });
}
/* Discover cards without a photo get the street photo too */
function fillCardPhotos(list, rerender){
  if(!mlyToken()) return; let pending=0;
  list.slice(0,6).forEach(p=>{ if(p.img || p.mlyTried) return; p.mlyTried=true; pending++;
    streetPhoto(p).then(x=>{ if(x){ p.img=x.url; p.imgStreet=true; } if(--pending===0) rerender(); }); });
}

/* ================= public transport guidance: walk → board → get off → next leg ================= */
function tLegs(it){ return it.legs.filter(l=> !(l.mode==="WALK" && l.duration<60)); }
function startTransitNav(it){
  if(!it) return;
  const legs=tLegs(it);
  S.tnav={it, legs, k:0, said:{}};
  closeSheet(); toggleLayers(false); $("top").hidden=true; $("navsign").hidden=false; $("tripbar").hidden=false; $("navFind").hidden=true;
  drawTransit(it); S.freeFollow=true; $("locBtn").classList.add("on"); setRest();
  try{ navigator.wakeLock?.request("screen").then(w=>S.tWake=w).catch(()=>{}); }catch(e){}
  announceLeg();
  transitTick(S.pos || {lat:legs[0].from.lat, lng:legs[0].from.lon});
  if(S.pos) followTo(S.pos);
}
function legText(l){
  const ms=BASE()==="ms", kd=legKind(l), nm=[l.routeShortName, l.routeLongName].filter(Boolean).join(" · ")||l.displayName||kd.toUpperCase();
  const stops=(l.intermediateStops||[]).length+1;
  if(kd==="walk") return {icon:"🚶", main:(ms?"Jalan kaki ke ":"Walk to ")+l.to.name, sub:(ms?"Tiba ":"Arrive ")+hhmm(l.endTime),
    say:(ms?"Jalan kaki ke ":"Walk to ")+l.to.name};
  if(kd==="car") return {icon:"🚗", main:(ms?"Pandu ke ":"Drive to ")+l.to.name, sub:(ms?"Letak kereta di sana":"Park there"), say:(ms?"Pandu ke ":"Drive to ")+l.to.name};
  return {icon:KIND_ICON[kd]||"🚆", main:(ms?"Naik ":"Take ")+nm+(l.headsign?(ms?" arah ":" towards ")+l.headsign:""),
    sub:(ms?"Turun di ":"Get off at ")+l.to.name+" · "+stops+(ms?" hentian":" stop"+(stops>1?"s":""))+" · "+hhmm(l.endTime),
    say:(ms?"Naik ":"Take the ")+(l.routeLongName||l.routeShortName||l.displayName||nm)+(l.headsign?(ms?" arah ":" towards ")+l.headsign:"")+(ms?" pada ":" at ")+hhmm(l.startTime)+". "+(ms?"Turun di ":"Get off at ")+l.to.name+", "+stops+(ms?" hentian.":" stop"+(stops>1?"s.":"."))};
}
function announceLeg(){ const T=S.tnav, l=T.legs[T.k]; if(!l || T.said["s"+T.k]) return; T.said["s"+T.k]=1; const x=legText(l); say(x.say); }
function transitTick(p){
  const T=S.tnav; if(!T) return;
  let l=T.legs[T.k];
  const to={lat:l.to.lat, lng:l.to.lon}, d=hav(p,to), kd=legKind(l), ms=BASE()==="ms";
  // reached the end of this leg?
  if(d < (kd==="walk"||kd==="car" ? 40 : 150)){
    T.k++;
    if(T.k>=T.legs.length){ say(P().arrive); toast(P().arrive+" · "+(ms?"tambang ≈ RM":"fare ≈ RM")+itinFare(T.it).total.toFixed(2)); endTransitNav(); return; }
    l=T.legs[T.k]; announceLeg(); return transitTick(p);
  }
  // warn before your stop
  if(kd!=="walk" && kd!=="car" && d < (kd==="rail"||kd==="ktm"||kd==="ets"||kd==="erl" ? 900 : 450) && !T.said["off"+T.k]){
    T.said["off"+T.k]=1; say((ms?"Bersedia untuk turun di ":"Get ready to get off at ")+l.to.name); }
  const x=legText(l), nx=T.legs[T.k+1];
  $("navArrow").innerHTML='<span class="tIcon">'+x.icon+'</span>';
  $("navDist").textContent=fmtDist(d); $("navIns").textContent=x.main; $("navRoad").textContent=x.sub;
  if(nx){ $("navNext").hidden=false; $("navNext").textContent=(ms?"Kemudian: ":"Then: ")+legText(nx).main; } else $("navNext").hidden=true;
  $("spd").textContent=Math.round((S.speed||0)*3.6);
  $("etaClock").textContent=hhmm(T.it.endTime);
  const left=T.legs.length-T.k; $("etaSub").textContent=left+(ms?" langkah lagi":" step"+(left>1?"s":"")+" left");
  $("etaFuel").textContent="🎫 "+(ms?"Tambang ≈ RM":"Fare ≈ RM")+itinFare(T.it).total.toFixed(2);
  $("alertX").hidden=true; $("alert").hidden=true;
}
function endTransitNav(){
  S.tnav=null; try{ S.tWake?.release(); }catch(e){}
  $("navsign").hidden=true; $("tripbar").hidden=true; $("top").hidden=false; $("navFind").hidden=false;
  S.freeFollow=false; $("locBtn").classList.remove("on");
  drawTransit(null); if(destMarker) destMarker.remove(); S.dest=null; S.routes=[]; S.transit=null; setRest();
  try{ speechSynthesis.cancel(); }catch(e){}
}

{ const old=S.fuel.type, map={ron95b:"ron95", dieselb:"diesel"};

  if(!CARS[S.fuel.car]) S.fuel.car="custom";

applyReportBtn(); paintToggles(); paintCompass(); renderChips(); renderTripModes(); wireTripbarSwipe(); wireMoreFabs(); wireTabs2(); $("tSign").onclick=()=>openTripPanel(); $("safeEnd").onclick=endSafe; $("safeSearch").onclick=()=>{ endSafe(); setTimeout(()=>$("q").focus(),100); }; loadReports(); $("briefStop").onclick=stopBriefing; applyMapStyle(); startGPS(); setRest();setInterval(loadReports, 60000);
if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
if(location.protocol==="file:") setTimeout(()=>toast("Open this page over https (e.g. GitHub Pages) so your phone allows GPS."), 1500);
